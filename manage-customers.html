<style>
:root{
  --ink:#0E1420; --ink2:#39424F; --ink3:#7C879A; --ink4:#A9B2C0;
  --line:#E6E9EF; --line2:#F0F2F6; --bg:#F5F6F8; --paper:#FFFFFF;
  --gold:#B98B2E; --gold2:#D9BE86; --goldbg:#FBF6EC;
  --blue:#2350D8; --bluebg:#EEF2FE;
  --good:#1F7A4C; --goodbg:#EBF6F0;
  --warn:#B3341F; --warnbg:#FDF0ED;
  --shadow:0 1px 2px rgba(14,20,32,.04),0 8px 24px rgba(14,20,32,.06);
  --shadow2:0 2px 6px rgba(14,20,32,.06),0 18px 40px rgba(14,20,32,.10);
  --r:20px; --r2:14px;
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#E9EBEF}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font-family:inherit;color:inherit}
.app{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);
  position:relative;overflow-x:hidden;box-shadow:0 0 60px rgba(14,20,32,.10)}
.pad{padding:0 18px}
.pb{padding-bottom:calc(112px + var(--safe))}
.loading{padding:120px 20px;text-align:center;color:var(--ink3);font-size:15px}

/* ── 타이포 ── */
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.10em;color:var(--ink4);text-transform:uppercase;display:block}
.h1{font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1.3;margin:6px 0 8px}
.h2{font-size:15px;font-weight:800;letter-spacing:-.02em;margin:26px 0 12px;display:flex;
  justify-content:space-between;align-items:center;gap:10px}
.h2 .more{font-size:13px;font-weight:700;color:var(--ink3);cursor:pointer;display:flex;align-items:center;gap:2px}
.sub{font-size:14.5px;color:var(--ink3);line-height:1.65;margin:0 0 18px}
.tiny{font-size:12.5px;color:var(--ink4)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.03em}

/* ── 헤더 ── */
.top{position:relative;background:var(--ink);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 26px;
  border-radius:0 0 26px 26px;overflow:hidden}
.top::after{content:"";position:absolute;right:-70px;top:-90px;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(217,190,134,.28),rgba(217,190,134,0) 65%)}
.top .row{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:9px}
.brand b{font-size:19px;font-weight:800;letter-spacing:.02em}
.brand .tagline{font-size:12px;color:#8E99AC;margin-top:1px;letter-spacing:0}
.mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(150deg,#D9BE86,#B98B2E);
  display:flex;align-items:center;justify-content:center;color:#0E1420;font-weight:900;font-size:15px}
.plan{font-size:11.5px;font-weight:800;padding:6px 11px;border-radius:20px;border:1px solid rgba(255,255,255,.18);
  color:#D9BE86;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap}
.plan.pro{background:linear-gradient(150deg,#D9BE86,#B98B2E);color:#0E1420;border-color:transparent}

/* ── 세그먼트 (집중 / 전체) ── */
.seg{display:flex;background:rgba(255,255,255,.09);border-radius:13px;padding:4px;margin-top:20px;position:relative;z-index:1}
.seg button{flex:1;border:0;background:none;color:#A5AEBE;font-size:14px;font-weight:800;padding:10px 0;
  border-radius:10px;cursor:pointer;transition:.18s;letter-spacing:-.02em}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.16)}

/* ── 카드 ── */
.card{background:var(--paper);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:12px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card.pop{box-shadow:var(--shadow2)}
.card.gold{background:linear-gradient(160deg,#FDFAF3,#F8F1E2);border:1px solid #EDE0C6}
.card.dark{background:var(--ink);color:#fff}
.card.center{text-align:center;padding:34px 20px}

/* ── KPI ── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px;position:relative;z-index:1}
.kpi{background:rgba(255,255,255,.09);border-radius:14px;padding:12px 4px;text-align:center}
.kpi b{display:block;font-size:22px;font-weight:800;letter-spacing:-.04em;line-height:1.2}
.kpi span{font-size:11px;color:#96A1B2;font-weight:600}
.kpi.alert b{color:#FF9E8C}
.kpi.gold b{color:#D9BE86}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.stat{background:var(--paper);border-radius:var(--r2);padding:14px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:21px;font-weight:800;letter-spacing:-.04em}
.stat span{font-size:11.5px;color:var(--ink3);font-weight:600}

/* ── 버튼 ── */
.btn{width:100%;border:0;border-radius:15px;font-size:16px;font-weight:800;cursor:pointer;
  padding:16px 18px;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;
  letter-spacing:-.02em;line-height:1.35;transition:transform .12s}
.btn:active{transform:scale(.985)}
.btn.dark{background:var(--ink);color:#fff}
.btn.dark:disabled{opacity:.35}
.btn.gold{background:linear-gradient(150deg,#D9BE86,#B98B2E);color:#241A05}
.btn.line{background:var(--paper);color:var(--ink2);border:1.5px solid var(--line)}
.btn.quiet{background:#EDEFF3;color:var(--ink2)}
.btn.sm{padding:12px 14px;font-size:14.5px;border-radius:12px;margin:0}
.btn.blue{background:var(--blue);color:#fff}
.row2{display:flex;gap:9px;margin-bottom:10px}
.row2 .btn{margin:0}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:20px;padding:9px 14px;
  font-size:13.5px;font-weight:700;color:var(--ink2);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.gold{background:var(--goldbg);border-color:#E9D9B6;color:var(--gold)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-ms-overflow-style:none;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.back{background:none;border:0;font-size:14.5px;font-weight:700;color:var(--ink3);cursor:pointer;
  padding:14px 0 6px;display:flex;align-items:center;gap:4px}
.ghostlink{background:none;border:0;color:var(--ink3);font-size:13px;font-weight:700;text-decoration:underline;
  cursor:pointer;display:block;margin:22px auto 0;padding:8px}

/* ── 입력 ── */
.field{margin-bottom:14px}
.label{font-size:13px;font-weight:800;color:var(--ink2);margin-bottom:7px;display:block}
.inp,.area{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px 15px;font-size:16px;
  font-family:inherit;background:var(--paper);color:var(--ink);line-height:1.6}
.inp:focus,.area:focus{outline:none;border-color:var(--ink)}
.area{resize:vertical;min-height:120px}
.err{background:var(--warnbg);color:#8C2617;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:10px;font-weight:600}
.note{background:var(--bluebg);border-radius:13px;padding:13px 15px;font-size:13.5px;color:#1E3C96;line-height:1.6;margin-bottom:12px}
.note b{cursor:pointer;border-bottom:1px solid currentColor}

/* ── 진행 ── */
.bar{height:6px;background:var(--line2);border-radius:4px;overflow:hidden;width:100%}
.bar i{display:block;height:100%;border-radius:4px;transition:width .45s cubic-bezier(.4,0,.2,1)}
.steps{display:flex;gap:5px;flex:1}
.steps i{flex:1;height:4px;border-radius:3px;background:var(--line);transition:.3s}
.steps i.on{background:var(--ink)}
.flowtop{display:flex;align-items:center;gap:14px;padding:calc(12px + env(safe-area-inset-top,0px)) 0 18px}
.flowtop .back{padding:0}
.ring{position:relative;width:74px;height:74px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val b{font-size:19px;font-weight:800;letter-spacing:-.04em;line-height:1}
.ring .val span{font-size:9.5px;color:var(--ink3);font-weight:700;margin-top:2px}

/* ── 리스트 ── */
.list{display:flex;flex-direction:column;gap:9px}
.item{display:flex;align-items:center;gap:12px;background:var(--paper);border:0;border-radius:var(--r2);
  padding:14px;width:100%;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.av{width:42px;height:42px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:16px;letter-spacing:-.02em}
.item .mid{flex:1;min-width:0}
.item .mid b{font-size:15.5px;font-weight:800;display:block;letter-spacing:-.02em}
.item .mid .l2{font-size:13px;color:var(--ink3);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot{width:3px;height:3px;border-radius:50%;background:var(--ink4);flex:none}
.late{color:var(--warn);font-weight:800}
.tagpill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px;background:var(--line2);color:var(--ink2)}
.tagpill.warn{background:var(--warnbg);color:var(--warn)}
.tagpill.good{background:var(--goodbg);color:var(--good)}
.tagpill.gold{background:var(--goldbg);color:var(--gold)}
.tagpill.blue{background:var(--bluebg);color:var(--blue)}
.blank{text-align:center;padding:44px 24px;color:var(--ink3);font-size:14.5px;line-height:1.75}

/* ── 퍼널 ── */
.fun{display:flex;flex-direction:column;gap:8px}
.funrow{display:flex;align-items:center;gap:10px;cursor:pointer}
.funrow .nm{width:60px;font-size:13px;font-weight:800;flex:none;color:var(--ink2)}
.funbar{flex:1;height:30px;background:var(--line2);border-radius:9px;overflow:hidden;position:relative}
.funbar i{display:block;height:100%;border-radius:9px;transition:width .5s}
.funbar em{position:absolute;left:10px;top:0;height:30px;display:flex;align-items:center;font-style:normal;
  font-size:12.5px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.funrow .ct{width:26px;text-align:right;font-size:14px;font-weight:800;flex:none}

/* ── 미션 카드 ── */
.mission{padding:22px 20px}
.mission .who{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mission h3{font-size:21px;font-weight:800;letter-spacing:-.035em;line-height:1.42;margin:0 0 8px}
.mission .why{font-size:13.5px;font-weight:700;color:var(--ink3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.script{background:#F7F8FA;border-radius:14px;padding:15px;margin-top:16px;border:1px solid var(--line2)}
.script .sh{font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--ink4);margin-bottom:8px}
.script p{margin:0 0 12px;font-size:15px;line-height:1.75;color:var(--ink2);white-space:pre-wrap}

/* ── 코칭 ── */
.coach{background:var(--paper);border-radius:var(--r2);padding:16px 17px;margin-bottom:10px;border-left:4px solid;box-shadow:var(--shadow)}
.coach .ch{font-size:12.5px;font-weight:800;letter-spacing:.02em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.coach p{margin:0;font-size:15.5px;line-height:1.72;color:var(--ink2)}
.c-good{border-color:var(--good)} .c-good .ch{color:var(--good)}
.c-miss{border-color:#C08A1E} .c-miss .ch{color:#8F6410}
.c-say{border-color:var(--blue)} .c-say .ch{color:var(--blue)}
.c-say p{font-weight:700;color:var(--ink)}
.c-pat{border-color:#6B4DE6} .c-pat .ch{color:#5A3FD1}

/* ── 상세 ── */
.kv{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2);font-size:14.5px;align-items:flex-start}
.kv:last-child{border:0;padding-bottom:0}
.kv>span{color:var(--ink3);width:92px;flex:none;font-weight:700;font-size:13.5px;padding-top:1px}
.kv>b{font-weight:700;flex:1}
.kv>b.warn{color:var(--warn)}
.stars{display:flex;gap:4px}
.stars button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:#fff;
  cursor:pointer;font-size:14px;padding:0;color:var(--ink4)}
.stars button.on{background:var(--goldbg);border-color:#E4D2AA;color:var(--gold)}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1.5px;background:var(--line)}
.tl{position:relative;padding:0 0 16px}
.tl::before{content:"";position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;
  background:#fff;border:2px solid var(--ink3)}
.tl.hot::before{border-color:var(--gold);background:var(--gold)}
.tl .d{font-size:11.5px;font-weight:800;color:var(--ink4);letter-spacing:.02em}
.tl .t{font-size:14.5px;font-weight:700;margin-top:2px;line-height:1.55}
.tl .x{font-size:13.5px;color:var(--ink3);margin-top:3px;line-height:1.6}

/* ── 채팅 ── */
.chatwrap{display:flex;flex-direction:column;height:100vh;height:100dvh}
.chathead{background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(11px + env(safe-area-inset-top,0px)) 15px 11px;display:flex;align-items:center;gap:11px;flex:none}
.chathead b{display:block;font-size:15.5px;font-weight:800}
.chathead span{font-size:12px;color:var(--ink3)}
.chatlog{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:86%;padding:13px 15px;border-radius:18px;font-size:15px;line-height:1.7;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.bub.ai{align-self:flex-start;background:#fff;border-bottom-left-radius:6px;box-shadow:var(--shadow);cursor:pointer}
.bub.think{color:var(--ink3);font-style:italic;box-shadow:none;background:#EFF1F5}
.chatbar{display:flex;gap:8px;padding:10px 13px calc(14px + var(--safe));background:var(--bg);flex:none;align-items:flex-end}
.chatin{flex:1;border:1.5px solid var(--line);border-radius:22px;padding:13px 16px;font-size:16px;
  font-family:inherit;resize:none;max-height:120px;line-height:1.5;background:#fff}
.chatin:focus{outline:none;border-color:var(--ink)}
.send{width:48px;height:48px;border-radius:50%;border:0;background:var(--ink);color:#fff;cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center}
.send:disabled{opacity:.3}

/* ── 음성 ── */
.dict{background:var(--paper);border-radius:var(--r);padding:24px 18px;text-align:center;box-shadow:var(--shadow);margin-bottom:14px}
.dict.live{background:#FFFBFA;box-shadow:0 0 0 2px rgba(179,52,31,.25),var(--shadow)}
.micbig{width:84px;height:84px;border-radius:50%;border:0;background:var(--ink);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;margin:0 auto;box-shadow:0 8px 22px rgba(14,20,32,.24)}
.micbig.on{background:var(--warn);animation:pulse 1.5s infinite;box-shadow:0 8px 22px rgba(179,52,31,.3)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}
.wave{display:flex;gap:4px;justify-content:center;align-items:flex-end;height:22px;margin-top:14px}
.wave i{width:4px;background:var(--warn);border-radius:3px;animation:wv .95s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}
.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
.wave i:nth-child(6){animation-delay:.5s}
@keyframes wv{0%,100%{height:6px}50%{height:20px}}
@media(prefers-reduced-motion:reduce){.micbig.on,.wave i{animation:none}.wave i{height:12px}}
.interim{font-size:14.5px;color:var(--ink2);margin-top:12px;line-height:1.65;background:#F5F6F8;
  border-radius:12px;padding:11px 13px;text-align:left}
.micbtn{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:#fff;cursor:pointer;
  flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.micbtn.on{background:var(--warn);border-color:var(--warn);color:#fff;animation:pulse 1.5s infinite}
.speak{background:none;border:0;font-size:12.5px;font-weight:700;color:var(--ink3);cursor:pointer;
  display:flex;align-items:center;gap:5px;margin-left:auto;padding:6px 0}

/* ── 교육 ── */
.track{background:var(--paper);border-radius:var(--r);margin-bottom:11px;overflow:hidden;box-shadow:var(--shadow)}
.trackh{display:flex;align-items:center;gap:13px;padding:16px;cursor:pointer}
.trackic{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
.trackh b{font-size:15.5px;font-weight:800;display:block;letter-spacing:-.02em}
.trackh span{font-size:12.5px;color:var(--ink3)}
.lesson{display:flex;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line2);cursor:pointer}

/* 태그 누적 */
function bump(list,inc){ const out=(list||[]).map(x=>({...x}));
  (inc||[]).forEach(tag=>{ if(typeof tag!=="string")return; const t=tag.trim().slice(0,20); if(!t)return;
    const f=out.find(x=>x.tag===t); if(f){f.count++;f.last=today();} else out.push({tag:t,count:1,last:today()}); });
  return out; }

/* 고객 상태 계산 — 케이던스(연락주기) + 정체 감지 */
function enrich(c){
  const st=SK[c.stage]||SK.new;
  const since=c.lastContact?gap(c.lastContact,today()):null;
  const due=c.nextContact?gap(c.nextContact,today()):(since==null?999:since-st.cad);
  const overdue=due>0;
  const stale=since!=null&&ACTIVE.indexOf(c.stage)>=0&&since>st.cad*3;   // 정체된 딜
  const heat=clamp(Math.round((c.temp||3)*20),0,100);
  return {...c,st,since,due,overdue,stale,heat};
}
/* 우선순위 점수 */
function rank(c){
  let s=0;
  if(c.overdue) s+=60+Math.min(c.due,20)*4;
  else if(c.due===0) s+=45;
  else s+=Math.max(0,20+c.due*2);
  s+=(c.st.w||0)*.45;
  s+=(c.temp||3)*6;
  if(c.stale) s+=25;
  if(c.value) s+=Math.min(20,c.value/100000*4);
  return Math.round(s);
}
function taskRank(t,c){
  const d=gap(t.due,today());
  let s=d>0?110+d*5:d===0?90:Math.max(10,50+d*6);
  if(t.kind==="promise") s+=30;     // 약속한 일은 최우선
  if(c) s+=(c.st.w||0)*.3+(c.temp||3)*4;
  return {s,late:d,why:d>0?`${d}일 지났어요`:d===0?"오늘까지예요":`${-d}일 남았어요`};
}

function buildQueue(db){
  const cs=db.customers.map(enrich);
  const byId=Object.fromEntries(cs.map(c=>[c.id,c]));
  const skip=new Set((db.skipped||[]).filter(s=>s.d===today()).map(s=>s.k));
  const q=[];
  db.tasks.filter(t=>!t.done).forEach(t=>{
    const c=byId[t.customerId]; const r=taskRank(t,c);
    if(r.late>=-1) q.push({k:"task:"+t.id,type:"task",score:r.s,late:r.late,why:r.why,task:t,cust:c,
      title:t.title,sub:c?`${c.name}${c.org?" · "+c.org:""}`:"나의 일",script:t.script,channel:t.channel});
  });
  cs.forEach(c=>{
    if(c.stage==="won"||!ACTIVE.concat(["won","hold"]).length) {}
    if(c.overdue&&!db.tasks.some(t=>!t.done&&t.customerId===c.id)){
      q.push({k:"reach:"+c.id,type:"reach",score:rank(c),late:c.due,cust:c,
        title:`${c.name}님께 연락할 때가 됐어요`,sub:`${c.st.n} · ${c.st.act}`,
        why:c.since==null?"아직 연락 기록이 없어요":`${c.since}일째 연락이 없어요`});
    }
  });
  cs.filter(c=>c.stale).slice(0,2).forEach(c=>{
    q.push({k:"stale:"+c.id,type:"stale",score:rank(c)-5,cust:c,
      title:`${c.name}님, 다음 단계로 옮길까요?`,sub:`${c.st.n} 단계에서 ${c.since}일 멈춰 있어요`,
      why:"멈춘 고객은 정리하거나 밀어야 해요"});
  });
  const lesson=nextLesson(db);
  if(lesson) q.push({k:"learn:"+lesson.id,type:"learn",score:34,lesson,
    title:lesson.t,sub:"오늘의 배움 · 2분",why:lesson.d});
  const active=cs.filter(c=>ACTIVE.indexOf(c.stage)>=0).length;
  if(active<(db.profile.goal||5)) q.push({k:"add:daily",type:"add",score:30,
    title:"오늘 만난 사람 한 명 등록하기",sub:`진행 중인 ${lbl(db)} ${active}명 / 목표 ${db.profile.goal||5}명`,
    why:"명단이 줄면 매출도 줄어요"});
  if(db.records.filter(r=>r.date===today()).length===0&&db.customers.length>0)
    q.push({k:"rec:daily",type:"record",score:28,title:"오늘 있었던 일 기록하기",
      sub:"말로 남기면 AI가 정리해요",why:"기억은 3일이면 70%가 사라져요"});
  return q.filter(x=>!skip.has(x.k)).sort((a,b)=>b.score-a.score);
}
function nextLesson(db){
  const done=new Set(db.learned);
  for(const tr of TRACKS){ if(tr.pro&&db.profile.plan!=="pro") continue;
    for(const l of tr.lessons) if(!done.has(l.id)) return {...l,track:tr}; }
  return null;
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function useDictation(apply){
  const [on,setOn]=useState(false),[interim,setInterim]=useState(""),[err,setErr]=useState("");
  const ref=useRef(null),base=useRef(""),want=useRef(false),fin=useRef("");
  const start=t0=>{
    if(!SR){setErr("이 브라우저는 음성 입력을 지원하지 않아요. 크롬으로 열어보세요.");return;}
    base.current=t0?t0.trim()+" ":""; fin.current=""; want.current=true; setErr("");
    const x=new SR(); x.lang="ko-KR"; x.continuous=true; x.interimResults=true;
    x.onresult=e=>{ let itm="";
      for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript;
        if(e.results[i].isFinal) fin.current+=t; else itm+=t; }
      setInterim(itm); apply(base.current+fin.current+itm); };
    x.onerror=ev=>{ if(ev.error==="no-speech")return; want.current=false; setOn(false);
      setErr(ev.error==="not-allowed"?"마이크 사용을 허용해 주세요.":"잘 안 들렸어요. 다시 눌러주세요."); };
    x.onend=()=>{ if(want.current){try{x.start();}catch(e){}} else {setOn(false);setInterim("");} };
    try{ x.start(); ref.current=x; setOn(true); }catch(e){ setErr("음성 입력을 시작하지 못했어요."); }
  };
  const stop=()=>{ want.current=false; if(ref.current){try{ref.current.stop();}catch(e){}} setOn(false); setInterim(""); };
  useEffect(()=>()=>{want.current=false; if(ref.current){try{ref.current.stop();}catch(e){}}},[]);
  return {on,interim,err,supported:!!SR,start,stop};
}
function speak(t){ try{ if(!window.speechSynthesis)return; window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.lang="ko-KR"; u.rate=.96; window.speechSynthesis.speak(u); }catch(e){} }

/* AI 호출 — 배포 시 서버리스 프록시(/api/ai)로 바꾸면 키가 노출되지 않습니다 */
const AI_ENDPOINT="https://api.anthropic.com/v1/messages";
async function askAI(prompt,history){
  const msgs=(history||[]).concat([{role:"user",content:prompt}]);
  const r=await fetch(AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1400,messages:msgs})});
  if(!r.ok) throw new Error("ai");
  const j=await r.json();
  return (j.content||[]).map(i=>i.text||"").join("");
}

  const org=(t.match(/([가-힣A-Za-z0-9]{2,14})(헬스케어|병원|약국|카페|필라테스|센터|회사|상사|학원|공방|스튜디오|매장)/)||[])[0]||"";
  const phone=(t.match(/01[016-9][-. ]?\d{3,4}[-. ]?\d{4}/)||[])[0]||"";
  const dm=has("대표","윗분","남편","아내","상의","승인","물어","결재","가족");
  const price=has("가격","비용","예산","단가","얼마","부담","비싸","할인");
  const sample=has("샘플","체험","시식","무료","드리기로","보내드리기로");
  const later=has("나중","다음에","생각해","고민","바빠");
  const good=has("좋다","괜찮","마음에","해볼","하고 싶");
  let stage=cust?cust.stage:"reach";
  if(good&&price) stage="nego"; else if(price||sample) stage="offer";
  else if(has("필요","고민","불편","힘들")) stage="need"; else if(later) stage="hold";
  const cares=[],objs=[],works=[],sT=[],wT=[],tasks=[];
  if(price){cares.push("비용 대비 효과");objs.push("비용 부담");}
  if(dm)objs.push("결정권자 승인 필요");
  if(later)objs.push("결정을 미룸");
  if(sample){sT.push("거절을 제안으로 전환");works.push("체험·샘플 제안");}
  if(has("질문","여쭤","물어보"))sT.push("질문으로 대화를 염");
  wT.push(dm?"결정권자 확인 안 함":later?"다음 약속을 못 잡음":"고객 말을 더 들을 여지");
  if(price)tasks.push({title:"약속한 자료·견적 보내기",channel:"카카오톡",days:0,kind:"promise",
    script:`${name||"고객"}님, 오늘 말씀 나눈 내용으로 정리해서 보내드립니다. 편하실 때 보시고 궁금한 점 말씀 주세요.`});
  tasks.push({title:dm?"결정하시는 분을 함께 뵐 수 있는지 여쭙기":"다시 연락드리기",
    channel:dm?"전화":"전화",days:2,kind:"followup",
    script:dm?`${name||"고객"}님, 지난번 건은 상의해 보셨을까요? 함께 자리하시면 제가 한 번에 설명드릴게요.`
             :`${name||"고객"}님, 지난번 말씀 나눈 건 어떻게 생각하셨는지 궁금해 연락드렸어요.`});
  return {offline:true,
    summary:`${name?name+"님과 ":""}이야기를 나누셨어요.`+(price?" 비용 이야기가 있었고":"")+
      (sample?" 먼저 체험해 보시기로 했습니다.":".")+(dm?" 결정하시는 분이 따로 계신 것 같아요.":""),
    customer:{name,org,contact:phone,decider:dm?"확인 필요":"",stage},
    praise:sample?"부담된다는 말에 바로 체험을 제안하신 게 좋았어요. 거절을 다음 기회로 바꾸셨습니다."
                 :"상황을 구체적으로 남기셨어요. 이게 다음 대화를 만듭니다.",
    miss:dm?"결정하시는 분이 따로 있다는 신호가 나왔는데 확인하지 않고 넘어가셨어요."
           :later?"고객이 미루는 진짜 이유를 더 묻지 않으셨어요."
           :"다음에 언제 뵐지 정하지 않고 마무리하셨어요.",
    betterScript:dm?"이런 건 보통 어떤 분과 상의해서 정하세요? 함께 자리하시면 제가 한 번에 설명드릴게요."
                   :"지금 가장 걸리는 부분이 무엇인지 편하게 말씀해 주시겠어요?",
    pattern:"",strengthTags:sT,weaknessTags:wT,cares,objections:objs,works,tasks};
}
function offlineChat(msg){
  const h=(...k)=>k.some(w=>msg.includes(w));
  if(h("거절","싫다","안 한","됐다","관심 없")) return PLAYBOOKS[3].s+"\n\n거절은 실패가 아니라 명단 정리예요. 보류로 옮기고 3개월 뒤 다시 노크하세요.";
  if(h("가격","깎","할인","비싸","싸게")) return PLAYBOOKS[4].s+"\n\n값을 내리면 제 가치도 같이 내려갑니다. 조건을 바꾸세요.";
  if(h("연락","답장","읽씹","무응답")) return PLAYBOOKS[2].s+"\n\n재촉은 역효과입니다. 짧게, 부담 없이가 정답이에요.";
  if(h("대표","승인","상의","결정")) return PLAYBOOKS[5].s;
  if(h("소개","추천")) return PLAYBOOKS[8].s;
  if(h("첫","처음","시작","뭐부터")) return "① 명단 30명 적기 → ② 안부 연락 3명 → ③ 만난 사람 바로 등록.\n\n오늘은 여기까지만 하세요. 하루에 하나면 충분합니다.";
  return "조금 더 자세히 알려주시겠어요? 고객이 실제로 한 말을 그대로 적어주시면 그에 맞는 문장을 만들어 드릴게요.\n\n(지금은 간단 코칭 모드예요.)";
}
function offlineContent(kind,topic,target){
  if(kind==="sns") return `${topic}\n\n처음엔 저도 반신반의했어요. 그런데 꾸준히 해보니 확실히 다르더라고요.\n\n${target}이신 분들이 특히 공감하실 것 같아요. 저도 그 시기를 지나봤거든요.\n\n궁금하신 분은 편하게 댓글이나 메시지 주세요 :)\n\n#기록 #꾸준함 #오늘도한걸음`;
  if(kind==="dm") return `안녕하세요! 지난번에 ${topic} 이야기 나눴었죠.\n\n관련해서 정리한 내용이 있어 보내드려요. 부담 갖지 마시고 편하게 보시면 됩니다.\n\n궁금한 점 있으시면 언제든 말씀해 주세요!`;
  if(kind==="offer") return `[제안] ${topic}\n\n1. 지금 상황\n- ${target} 기준으로 가장 자주 나오는 고민 한 가지\n\n2. 제안 내용\n- 무엇을 / 얼마에 / 언제부터, 세 줄로 정리\n\n3. 시작 방법\n- 오늘 결정하지 않으셔도 됩니다. 다음 확인 날짜만 정해요.`;
  return `[${topic}] 자료\n\n1. 왜 중요한가\n2. 무엇을 알아야 하나 (${target} 기준 3가지)\n3. 오늘 바로 해볼 것 하나\n\n※ 인터넷에 연결되면 더 자세히 만들어집니다.`;
}

  useEffect(()=>{ if(!live||pro)return;
    try{ (window.adsbygoogle=window.adsbygoogle||[]).push({}); }catch(e){} },[live,pro]);
  if(pro||!ADS.enabled) return null;
  return (<div className="ad" ref={ref}>
    <span className="lb">{label}</span>
    {live?(<ins className="adsbygoogle" style={{display:"block"}} data-ad-client={ADS.adsense.client}
        data-ad-slot={ADS.adsense.slot} data-ad-format="auto" data-full-width-responsive="true"/>)
      :(<div className="body"><b>광고 영역</b><span>AdMob 배너 320×100 / AdSense 반응형</span></div>)}
    <button className="rm" onClick={onUpgrade}>광고 없이 쓰기 →</button>

}
function Interstitial({onClose,onUpgrade}){
  const [sec,setSec]=useState(4);

  return (<div className="full">

      <button className="btn gold sm" onClick={onUpgrade}>프로 살펴보기</button>
    </div>
    <button className="close" disabled={sec>0} onClick={onClose}>{sec>0?`${sec}초 후 닫기`:"닫기"}</button>

}

function App(){
  const [db,setDb]=useState(null);
  const [view,setView]=useState({n:"home"});
  const [toast,setToast]=useState("");
  const [pay,setPay]=useState(null);
  const [inter,setInter]=useState(false);
  const [quick,setQuick]=useState(false);

  useEffect(()=>{ store.get(KEY).then(v=>{ let d=null; try{d=v?JSON.parse(v):null;}catch(e){}
    const s=d?{...emptyState(),...d,profile:{...emptyState().profile,...(d.profile||{})}}:emptyState();
    if(s.usage.date!==today()) s.usage={date:today(),ai:0,bonus:0,steps:0};
    setDb(s); if(!s.profile.onboarded) setView({n:"onboard"});
  }); },[]);

  const save=useCallback(n=>{ setDb(n); store.set(KEY,JSON.stringify(n)); },[]);
  const notify=useCallback(m=>{ setToast(m); setTimeout(()=>setToast(""),2400); },[]);
  const nav=useCallback(v=>{ setView(v); window.scrollTo(0,0); },[]);
  const upgrade=r=>setPay(r||true);
  if(!db) return <div className="app"><div className="loading">잠시만요…</div></div>;

  const pro=db.profile.plan==="pro";
  const lim=pro?PLAN.pro:PLAN.free;
  const aiLeft=pro?Infinity:Math.max(0,lim.aiPerDay+(db.usage.bonus||0)-(db.usage.ai||0));
  const canAI=()=>{ if(pro)return true;
    if(aiLeft<=0){ upgrade("오늘 AI 사용을 다 쓰셨어요"); return false; } return true; };
  const spendAI=()=>{ if(!pro) save2(d=>({...d,usage:{...d.usage,ai:(d.usage.ai||0)+1}})); };
  const save2=fn=>{ setDb(prev=>{ const n=fn(prev); store.set(KEY,JSON.stringify(n)); return n; }); };
  const rewardAd=()=>{ setInter(true);
    save2(d=>({...d,usage:{...d.usage,bonus:(d.usage.bonus||0)+ADS.rewardAiCalls}}));
    notify(`AI ${ADS.rewardAiCalls}회를 충전했어요`); };

  /* 고객 기록 남기기 */
  const pushHist=(cid,entry)=>save2(d=>({...d,customers:d.customers.map(c=>c.id!==cid?c:
    ({...c,history:[{id:uid(),date:today(),...entry},...(c.history||[])].slice(0,60)})) }));

  /* 실행 1건 완료 처리 */
  const bumpStep=()=>{ save2(d=>{ const steps=(d.usage.steps||0)+1;
      const last=d.streak.last, sc=last===today()?d.streak.count:(last&&gap(last,today())===1?d.streak.count+1:1);
      return {...d,usage:{...d.usage,steps},streak:{count:sc,last:today()}}; });
    const n=(db.usage.steps||0)+1;
    if(!pro&&ADS.enabled&&n%ADS.interstitialEvery===0) setTimeout(()=>setInter(true),350);
  };
  const skipStep=k=>save2(d=>({...d,skipped:[...(d.skipped||[]).filter(s=>s.d===today()),{d:today(),k}]}));

  const S={db,save,save2,notify,nav,pro,lim,aiLeft,canAI,spendAI,upgrade,pushHist,bumpStep,skipStep,rewardAd};
  const queue=buildQueue(db);
  const tabs=["home","run","customers","growth"];
  const showTabs=tabs.indexOf(view.n)>=0;

  let body;
  switch(view.n){
    case "onboard":   body=<Onboard {...S}/>; break;
    case "home":      body=<Home {...S} queue={queue}/>; break;
    case "run":       body=<Runner {...S} queue={queue}/>; break;
    case "customers": body=<Customers {...S}/>; break;
    case "customer":  body=<Detail {...S} id={view.id}/>; break;
    case "addcust":   body=<AddCustomer {...S} preset={view.preset}/>; break;
    case "record":    body=<RecordFlow {...S} id={view.id}/>; break;
    case "coach":     body=<Coach {...S} id={view.id}/>; break;
    case "content":   body=<Content {...S}/>; break;
    case "learn":     body=<Learn {...S}/>; break;
    case "lesson":    body=<Lesson {...S} id={view.id}/>; break;
    case "plays":     body=<Plays {...S}/>; break;
    case "team":      body=<Team {...S}/>; break;
    case "settings":  body=<Settings {...S}/>; break;
    default:          body=<Growth {...S} queue={queue}/>;
  }
  return (<div className={showTabs?"app pb":"app"}>
    {body}
    {showTabs&&(<React.Fragment>
      <nav className="tabbar">
        <Tab n="home"  cur={view.n} ic="home"  l="홈"   go={nav}/>
        <Tab n="run"   cur={view.n} ic="target" l="실행" go={nav} badge={queue.filter(q=>q.late>0).length}/>
        <button className="tb" onClick={()=>setQuick(true)} aria-label="빠른 작업">
          <span style={{width:42,height:42,borderRadius:14,background:"var(--ink)",color:"#fff",display:"flex",
            alignItems:"center",justifyContent:"center",marginTop:-14,boxShadow:"0 6px 16px rgba(14,20,32,.28)"}}>
            <I n="plus" s={22}/></span></button>
        <Tab n="customers" cur={view.n} ic="users" l="고객" go={nav}/>
        <Tab n="growth" cur={view.n} ic="chart" l="성장" go={nav}/>
      </nav>
    </React.Fragment>)}
    {quick&&(<div className="sheet" onClick={()=>setQuick(false)}>
      <div className="sheetin" onClick={e=>e.stopPropagation()}>
        <div className="grab"/>
        <h2 style={{fontSize:19,fontWeight:800,margin:"0 0 4px",letterSpacing:"-.03em"}}>무엇을 할까요?</h2>
        <p className="sub" style={{marginBottom:16}}>하나씩만 하면 됩니다.</p>
        {[["addcust","users","고객 등록하기","이름만 알아도 괜찮아요"],
          ["record","mic","오늘 있었던 일 기록","말하면 AI가 정리해요"],
          ["coach","msg","AI 코치에게 묻기","막힌 곳을 바로 풀어요"],
          ["content","pen","콘텐츠 만들기","SNS·메시지·제안서"],
          ["plays","book","상황별 대본 보기","그대로 복사해서 쓰세요"]].map(([n,ic,t,s])=>(
          <button key={n} className="item" style={{marginBottom:9}} onClick={()=>{setQuick(false);nav({n});}}>
            <span className="av" style={{background:"var(--line2)",color:"var(--ink2)"}}><I n={ic} s={19}/></span>
            <span className="mid"><b>{t}</b><span className="l2">{s}</span></span><I n="chev" s={17} c="var(--ink4)"/>
          </button>))}
      </div></div>)}
    {pay&&<Paywall db={db} save={save} close={()=>setPay(null)} notify={notify}
      reason={typeof pay==="string"?pay:null}/>}
    {inter&&<Interstitial onClose={()=>setInter(false)} onUpgrade={()=>{setInter(false);upgrade();}}/>}
    {toast&&<div className="toast">{toast}</div>}
  </div>);
}
function Tab({n,cur,ic,l,go,badge}){
  return (<button className={cur===n?"tb on":"tb"} onClick={()=>go({n})}>
    <I n={ic} s={21}/><span>{l}</span>{badge>0&&<span className="bdg">{badge}</span>}</button>);
}

      <div className="item" key={t} style={{cursor:"default",marginBottom:9}}>

        <span className="mid"><b>{t}</b><span className="l2">{d}</span></span></div>))}
    <button className="btn dark" style={{marginTop:20}} onClick={()=>setS(1)}>시작하기<I n="arrow" s={18}/></button>
  </div>);
  const P1=(<div>
    <span className="eyebrow">1 / 3</span><h1 className="h1">어떤 일을 하고 계세요?</h1>
    <p className="sub">하는 일에 맞춰 단계와 문장을 바꿔 드려요.</p>
    <div className="list">
      {JOBS.map(j=>(<button key={j.k} className="item" onClick={()=>setJob(j.k)}
        style={job===j.k?{boxShadow:"0 0 0 2px var(--ink)"}:null}>
        <span className="mid"><b>{j.n}</b><span className="l2">{j.ex}</span></span>
        {job===j.k&&<I n="check" s={19} c="var(--ink)"/>}</button>))}
    </div>
    <button className="btn dark" style={{marginTop:18}} onClick={()=>setS(2)}>다음</button>
  </div>);
  const P2=(<div>
    <span className="eyebrow">2 / 3</span><h1 className="h1">진행 중인 {JOBMAP[job].unit},<br/>몇 명을 유지할까요?</h1>
    <p className="sub">이 숫자보다 적어지면 새 사람을 만나라고 알려드려요. 처음엔 5명이면 충분합니다.</p>
    <div className="card center" style={{padding:"26px 20px"}}>
      <b className="num" style={{fontSize:52,fontWeight:800,letterSpacing:"-.05em"}}>{goal}</b>
      <div className="tiny" style={{marginBottom:16}}>명</div>
      <input type="range" min="3" max="30" value={goal} onChange={e=>setGoal(+e.target.value)}
        style={{width:"100%",accentColor:"#0E1420"}}/>
      <div style={{display:"flex",justifyContent:"space-between"}} className="tiny"><span>3</span><span>30</span></div>
    </div>
    <button className="btn dark" onClick={()=>setS(3)}>다음</button>
  </div>);
  const P3=(<div>
    <span className="eyebrow">3 / 3</span><h1 className="h1">뭐라고 불러 드릴까요?</h1>
    <p className="sub">코치가 부를 이름이에요. 비워두셔도 괜찮아요.</p>
    <input className="inp" value={name} placeholder="예) 김성호" onChange={e=>setName(e.target.value)}/>
    <button className="btn dark" style={{marginTop:14}} onClick={done}>AIVO 시작하기</button>
    <p className="tiny" style={{textAlign:"center",lineHeight:1.7}}>
      모든 기록은 이 기기에만 저장돼요.<br/>무료로 {PLAN.free.customers}명까지 관리할 수 있습니다.</p>
  </div>);
  return (<div className="pad" style={{paddingBottom:40}}>
    {s>0&&(<div className="flowtop">
      <button className="back" onClick={()=>setS(s-1)}><I n="back" s={18}/></button>
      <div className="steps">{[1,2,3].map(n=><i key={n} className={n<=s?"on":""}/>)}</div></div>)}
    {[P0,P1,P2,P3][s]}
  </div>);
}

/* ══════════════════════════════════════════════════════════════
   11. 홈 — 집중(한 번에 하나) / 전체(대시보드) 전환
   ══════════════════════════════════════════════════════════════ */
function Home({db,nav,queue,pro,upgrade,aiLeft,rewardAd}){
  const [mode,setMode]=useState(()=>{ try{return localStorage.getItem("aivo-mode")||"focus";}catch(e){return "focus";} });
  const setM=m=>{ setMode(m); try{localStorage.setItem("aivo-mode",m);}catch(e){} };
  const cs=db.customers.map(enrich);
  const doneToday=db.tasks.filter(t=>t.done&&t.doneAt===today()).length+(db.usage.steps||0);
  const total=queue.length+doneToday;
  const pct=total?Math.round(doneToday/total*100):0;
  const late=queue.filter(q=>q.late>0).length;
  const unit=lbl(db);
  const hour=new Date().getHours();
  const greet=hour<11?"좋은 아침이에요":hour<17?"오늘도 한 걸음":"오늘 하루 고생하셨어요";

  return (<div>
    <header className="top">
      <div className="row">
        <div className="brand">
          <span className="mark">A</span>
          <div><b>AIVO</b><div className="tagline">{greet}{db.profile.name?`, ${db.profile.name}님`:""}</div></div>
        </div>
        <button className={pro?"plan pro":"plan"} onClick={()=>upgrade()}>
          <I n="crown" s={13}/>{pro?"프로":"무료"}</button>
      </div>
      <div className="kpis">
        <div className="kpi"><b className="num">{queue.length}</b><span>오늘 할 일</span></div>
        <div className={late?"kpi alert":"kpi"}><b className="num">{late}</b><span>지연</span></div>
        <div className="kpi"><b className="num">{cs.filter(c=>ACTIVE.indexOf(c.stage)>=0).length}</b><span>진행 중</span></div>
        <div className="kpi gold"><b className="num">{db.streak.count}</b><span>연속일</span></div>
      </div>
      <div className="seg">
        <button className={mode==="focus"?"on":""} onClick={()=>setM("focus")}>집중 · 하나씩</button>
        <button className={mode==="all"?"on":""} onClick={()=>setM("all")}>전체 대시보드</button>
      </div>
    </header>
    <div className="pad" style={{paddingTop:16}}>
      {mode==="focus"
        ? <FocusHome db={db} nav={nav} queue={queue} pct={pct} doneToday={doneToday} unit={unit}
            pro={pro} upgrade={upgrade} aiLeft={aiLeft} rewardAd={rewardAd}/>
        : <Overview db={db} nav={nav} queue={queue} cs={cs} pro={pro} upgrade={upgrade} unit={unit}/>}
    </div>
  </div>);
}

/* ── 집중 모드: 다음 할 일 딱 하나 ── */
function FocusHome({db,nav,queue,pct,doneToday,unit,pro,upgrade,aiLeft,rewardAd}){
  const next=queue[0];
  const R=42,C=2*Math.PI*R;
  return (<div>
    <div className="card pop" style={{display:"flex",gap:16,alignItems:"center",padding:"18px"}}>
      <div className="ring">
        <svg width="74" height="74" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r={R} fill="none" stroke="#EFF1F5" strokeWidth="9"/>
          <circle cx="50" cy="50" r={R} fill="none" stroke="#0E1420" strokeWidth="9" strokeLinecap="round"
            strokeDasharray={C} strokeDashoffset={C*(1-pct/100)} style={{transition:"stroke-dashoffset .6s"}}/>
        </svg>
        <div className="val"><b className="num">{pct}%</b><span>오늘</span></div>
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:15.5,fontWeight:800,letterSpacing:"-.02em"}}>
          {queue.length===0?"오늘 할 일을 다 하셨어요":`남은 일 ${queue.length}개`}</div>
        <div className="tiny" style={{marginTop:3,lineHeight:1.55}}>
          오늘 {doneToday}개 완료 · 연속 {db.streak.count}일<br/>한 번에 하나씩만 보여드릴게요.</div>
      </div>
    </div>

    {next?(<React.Fragment>
      <div className="h2"><span>지금 이것부터</span><span className="tiny">1 / {queue.length}</span></div>
      <div className="card pop mission">
        <div className="who">
          <span className="av" style={next.cust?avStyle(next.cust.name):{background:"var(--ink)",color:"#fff"}}>
            {next.cust?initial(next.cust.name):<I n={next.type==="learn"?"book":next.type==="add"?"plus":"spark"} s={19}/>}</span>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13.5,fontWeight:800,color:"var(--ink2)"}}>{next.sub}</div>
            {next.cust&&<div className="tiny">{next.cust.st.n} 단계 · 접촉 {next.cust.touches||0}/{TOUCH_GOAL}회</div>}
          </div>
        </div>
        <h3>{next.title}</h3>
        <div className="why">{next.late>0&&<span className="late">{next.late}일 지남</span>}
          {next.late>0&&<span className="dot"/>}<span>{next.why||""}</span></div>
        <button className="btn dark" style={{marginTop:18,marginBottom:0}} onClick={()=>nav({n:"run"})}>
          하나씩 시작하기<I n="arrow" s={18}/></button>
      </div>
    </React.Fragment>):(
      <div className="card center">
        <div className="bigck"><I n="check" s={30}/></div>
        <h3 style={{fontSize:19,fontWeight:800,margin:"0 0 8px",letterSpacing:"-.03em"}}>오늘은 여기까지예요</h3>
        <p className="sub" style={{marginBottom:16}}>남은 힘은 내일 쓰세요.<br/>새 {unit}을 한 분 더 등록해두면 내일이 편해집니다.</p>
        <button className="btn line" style={{marginBottom:0}} onClick={()=>nav({n:"addcust"})}>{unit} 등록하기</button>
      </div>)}

    <AdSlot pro={pro} onUpgrade={()=>upgrade()}/>

    <div className="h2"><span>바로 하기</span></div>
    <div className="list">
      {[["record","mic","오늘 있었던 일 기록","말하면 AI가 정리하고 다음 할 일까지 만들어요"],
        ["coach","msg","AI 코치에게 묻기",pro?"무제한":`오늘 ${aiLeft}회 남음`],
        ["plays","book","상황별 대본","첫 연락 · 거절 · 가격 · 소개"],
        ["learn","seed","오늘의 배움",`${db.learned.length} / ${LESSON_TOTAL}과 완료`]].map(([n,ic,t,s])=>(
        <button key={n} className="item" onClick={()=>nav({n})}>
          <span className="av" style={{background:"var(--line2)",color:"var(--ink2)"}}><I n={ic} s={19}/></span>
          <span className="mid"><b>{t}</b><span className="l2">{s}</span></span>
          <I n="chev" s={17} c="var(--ink4)"/></button>))}
    </div>
    {!pro&&aiLeft<=2&&(<button className="btn line" style={{marginTop:12}} onClick={rewardAd}>
      <I n="spark" s={18}/>광고 보고 AI {ADS.rewardAiCalls}회 더 받기</button>)}
    <div style={{height:8}}/>
  </div>);
}

/* ── 전체 대시보드 ── */
function Overview({db,nav,queue,cs,pro,upgrade,unit}){
  const act=cs.filter(c=>ACTIVE.indexOf(c.stage)>=0);
  const won=cs.filter(c=>c.stage==="won");
  const pipeline=act.reduce((a,c)=>a+(c.value||0)*(c.st.w/100),0);
  const wonVal=won.reduce((a,c)=>a+(c.value||0),0);
  const overdue=cs.filter(c=>c.overdue&&c.stage!=="won");
  const stale=cs.filter(c=>c.stale);
  const max=Math.max(1,...STAGES.map(s=>cs.filter(c=>c.stage===s.k).length));
  const monthRec=db.records.filter(r=>r.date.slice(0,7)===today().slice(0,7)).length;
  const doneRate=db.tasks.length?Math.round(db.tasks.filter(t=>t.done).length/db.tasks.length*100):0;
  const winRate=(won.length+cs.filter(c=>c.stage==="hold").length)
    ? Math.round(won.length/(won.length+cs.filter(c=>c.stage==="hold").length)*100):0;
  const week=[...Array(7)].map((_,i)=>{ const d=addDays(today(),-6+i);
    return {d,n:db.records.filter(r=>r.date===d).length+db.tasks.filter(t=>t.doneAt===d).length}; });
  const wmax=Math.max(1,...week.map(w=>w.n));
  return (<div>
    <div className="stats">
      <div className="stat"><b className="num">{db.customers.length}</b><span>전체 {unit}</span></div>
      <div className="stat"><b className="num">{act.length}</b><span>진행 중</span></div>
      <div className="stat"><b className="num" style={{color:overdue.length?"var(--warn)":undefined}}>{overdue.length}</b><span>연락 지연</span></div>
    </div>

    <div className="card">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <span className="eyebrow">파이프라인</span>
        <span className="tiny">단계를 누르면 해당 {unit}만 보여요</span>
      </div>
      <div className="fun">
        {STAGES.map(s=>{ const n=cs.filter(c=>c.stage===s.k).length;
          return (<div className="funrow" key={s.k} onClick={()=>nav({n:"customers",stage:s.k})}>
            <span className="nm">{s.n}</span>
            <span className="funbar"><i style={{width:`${Math.max(n?12:0,n/max*100)}%`,background:s.c}}/>
              {n>0&&<em>{s.d}</em>}</span>
            <span className="ct num">{n}</span></div>); })}
      </div>
    </div>

    {pro?(<div className="card">
      <span className="eyebrow">예상 매출</span>
      <div style={{display:"flex",gap:14,marginTop:10}}>
        <div style={{flex:1}}><div className="tiny">진행 중 (단계 가중)</div>
          <b className="num" style={{fontSize:22,fontWeight:800,letterSpacing:"-.04em"}}>{won2(pipeline)}</b></div>
        <div style={{flex:1}}><div className="tiny">성사 누적</div>
          <b className="num" style={{fontSize:22,fontWeight:800,letterSpacing:"-.04em",color:"var(--good)"}}>{won2(wonVal)}</b></div>
      </div>
      <div style={{display:"flex",gap:14,marginTop:16,paddingTop:14,borderTop:"1px solid var(--line2)"}}>
        <div style={{flex:1}}><div className="tiny">성사율</div><b className="num" style={{fontSize:18,fontWeight:800}}>{winRate}%</b></div>
        <div style={{flex:1}}><div className="tiny">실행 완료율</div><b className="num" style={{fontSize:18,fontWeight:800}}>{doneRate}%</b></div>
        <div style={{flex:1}}><div className="tiny">이번 달 기록</div><b className="num" style={{fontSize:18,fontWeight:800}}>{monthRec}</b></div>
      </div>
    </div>):<Locked text="예상 매출 · 성사율 · 주간 리포트 보기" onClick={()=>upgrade("심화 분석은 프로 기능이에요")}/>}

    <div className="card">
      <span className="eyebrow">최근 7일 활동</span>
      <div style={{display:"flex",gap:6,alignItems:"flex-end",height:74,marginTop:14}}>
        {week.map(w=>(<div key={w.d} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
          <div style={{width:"100%",height:`${Math.max(6,w.n/wmax*54)}px`,borderRadius:6,
            background:w.d===today()?"var(--ink)":"#DDE1E8"}}/>
          <span className="tiny" style={{fontSize:10}}>{new Date(w.d).getDate()}</span>
        </div>))}
      </div>
    </div>

    {overdue.length>0&&(<React.Fragment>
      <div className="h2"><span>지금 연락해야 할 분</span>
        <span className="more" onClick={()=>nav({n:"customers",filter:"overdue"})}>전체<I n="chev" s={14}/></span></div>
      <div className="list">{overdue.slice(0,4).map(c=><CustRow key={c.id} c={c} go={()=>nav({n:"customer",id:c.id})}/>)}</div>
    </React.Fragment>)}

    {stale.length>0&&(<React.Fragment>
      <div className="h2"><span>멈춰 있는 {unit}</span><span className="tiny">밀거나 정리하세요</span></div>
      <div className="list">{stale.slice(0,3).map(c=><CustRow key={c.id} c={c} go={()=>nav({n:"customer",id:c.id})}/>)}</div>
    </React.Fragment>)}

    <AdSlot pro={pro} onUpgrade={()=>upgrade()}/>

    <div className="h2"><span>오늘의 실행 전체</span>
      <span className="more" onClick={()=>nav({n:"run"})}>하나씩 하기<I n="chev" s={14}/></span></div>
    <div className="list">
      {queue.slice(0,8).map(q=>(<div className="item" key={q.k} style={{cursor:"default"}}>
        <span className="av" style={q.cust?avStyle(q.cust.name):{background:"var(--line2)",color:"var(--ink3)"}}>
          {q.cust?initial(q.cust.name):<I n={q.type==="learn"?"book":"spark"} s={18}/>}</span>
        <span className="mid"><b>{q.title}</b>
          <span className="l2">{q.sub}{q.late>0&&<React.Fragment><span className="dot"/><span className="late">{q.late}일 지남</span></React.Fragment>}</span></span>
      </div>))}
      {queue.length===0&&<div className="blank">오늘 할 일을 모두 마쳤어요.<br/>새 {unit}을 등록하면 다음 할 일이 생겨요.</div>}
    </div>
    <div style={{height:8}}/>
  </div>);
}
const won2=n=>n>=100000000?`${(n/100000000).toFixed(1)}억`:n>=10000?`${Math.round(n/10000).toLocaleString()}만원`:n?`${n.toLocaleString()}원`:"—";

function CustRow({c,go}){
  return (<button className="item" onClick={go}>
    <span className="av" style={avStyle(c.name)}>{initial(c.name)}</span>
    <span className="mid"><b>{c.name}{c.org&&<span style={{fontWeight:600,color:"var(--ink3)",fontSize:13}}> · {c.org}</span>}</b>
      <span className="l2"><span className="tagpill" style={{background:c.st.c+"1A",color:c.st.c}}>{c.st.n}</span>
        {c.since==null?<span>연락 기록 없음</span>
          :<span className={c.overdue?"late":""}>{c.overdue?`${c.due}일 지남`:`${c.since}일 전 연락`}</span>}
        {c.stale&&<React.Fragment><span className="dot"/><span>멈춤</span></React.Fragment>}
      </span></span>
    <I n="chev" s={17} c="var(--ink4)"/></button>);
}

/* ══════════════════════════════════════════════════════════════
   12. 실행 러너 — 한 번에 하나씩 (핵심)
   ══════════════════════════════════════════════════════════════ */
function stageScript(c,me){
  const n=c.name||"고객";
  switch(c.stage){
    case "new":  return `안녕하세요 ${n}님, ${me||""}입니다.\n연락처 남겨주셔서 인사드려요. 부담 갖지 마시고, 편하실 때 5분만 이야기 나눌 수 있을까요?`;
    case "reach":return `${n}님 안녕하세요! 지난번 이야기 즐거웠어요.\n이번 주 중에 잠깐 뵐 수 있을까요? 편하신 요일 알려주시면 제가 맞출게요.`;
    case "need": return `${n}님, 지난번에 말씀하신 그 부분 계속 생각했어요.\n제가 도움 드릴 수 있는 방법을 정리해 봤는데, 짧게 보여드려도 될까요?`;
    case "offer":return `${n}님, 보내드린 내용 보셨을까요?\n한 번에 결정하지 않으셔도 괜찮아요. 궁금한 점만 편하게 말씀해 주세요.`;
    case "nego": return `${n}님, 말씀하신 부분 반영해서 조정해 봤어요.\n이번 주 시작과 다음 달 시작 중 어느 쪽이 편하실까요?`;
    case "won":  return `${n}님, 시작하신 뒤로 불편한 점은 없으셨어요?\n작은 것도 편하게 말씀해 주세요. 그게 제 일이에요!`;
    default:     return `${n}님 안녕하세요, 오랜만이에요.\n예전에 말씀하셨던 그 부분, 그 뒤로 좀 나아지셨을까요? 문득 생각나서 연락드렸어요.`;
  }
}
function Runner({db,save2,notify,nav,queue,pushHist,bumpStep,skipStep,pro,upgrade}){
  const [i,setI]=useState(0);
  const [fin,setFin]=useState(false);
  const total=queue.length;
  const q=queue[i];
  const advance=()=>{ if(i+1>=total) setFin(true); else setI(i+1); window.scrollTo(0,0); };
  const copy=t=>{ try{navigator.clipboard.writeText(t);}catch(e){} notify("복사했어요"); };

  const contact=(c,ch)=>{
    save2(d=>({...d,customers:d.customers.map(x=>x.id!==c.id?x:({...x,lastContact:today(),
      touches:(x.touches||0)+1,nextContact:addDays(today(),(SK[x.stage]||SK.new).cad)}))}));
    pushHist(c.id,{kind:"contact",text:`${ch||"연락"}함`});
    bumpStep(); notify("기록했어요. 다음 연락일도 잡아뒀어요"); advance();
  };
  const finishTask=t=>{
    save2(d=>({...d,tasks:d.tasks.map(x=>x.id===t.id?{...x,done:true,doneAt:today()}:x),
      customers:d.customers.map(c=>c.id!==t.customerId?c:({...c,lastContact:today(),touches:(c.touches||0)+1,
        nextContact:addDays(today(),(SK[c.stage]||SK.new).cad)}))}));
    if(t.customerId) pushHist(t.customerId,{kind:"task",text:t.title});
    bumpStep(); notify("잘하셨어요!"); advance();
  };
  const delay=(t,n)=>{ save2(d=>({...d,tasks:d.tasks.map(x=>x.id===t.id?{...x,due:addDays(today(),n)}:x)}));
    notify(`${n}일 뒤로 미뤘어요`); advance(); };
  const moveStage=(c,k)=>{ save2(d=>({...d,customers:d.customers.map(x=>x.id!==c.id?x:
      ({...x,stage:k,nextContact:addDays(today(),SK[k].cad)}))}));
    pushHist(c.id,{kind:"stage",text:`${c.st.n} → ${SK[k].n}`}); bumpStep(); notify("단계를 옮겼어요"); advance(); };
  const learnDone=l=>{ save2(d=>({...d,learned:d.learned.indexOf(l.id)>=0?d.learned:[...d.learned,l.id]}));
    bumpStep(); notify("한 과 끝냈어요 👏"); advance(); };

  if(fin||!q) return (<div className="pad">
    <div className="done">
      <div className="bigck"><I n="check" s={32}/></div>
      <h1 className="h1">{total?"오늘 할 일 끝!":"지금은 할 일이 없어요"}</h1>
      <p className="sub">{total?`${total}개를 하나씩 처리하셨어요. 연속 ${db.streak.count}일째입니다.`
        :"고객을 등록하면 오늘의 실행이 만들어져요."}</p>
      <button className="btn dark" onClick={()=>nav({n:"home"})}>홈으로</button>
      <button className="btn line" onClick={()=>nav({n:"addcust"})}>{lbl(db)} 한 명 더 등록</button>
    </div></div>);

  const c=q.cust;
  return (<div className="pad" style={{paddingBottom:40}}>
    <div className="flowtop">
      <button className="back" onClick={()=>i===0?nav({n:"home"}):setI(i-1)}><I n="back" s={18}/></button>
      <div className="steps">{queue.slice(0,Math.min(total,10)).map((_,n)=><i key={n} className={n<=i?"on":""}/>)}</div>
      <span className="tiny num" style={{fontWeight:800}}>{i+1}/{total}</span>
    </div>

    <div className="card pop mission">
      <div className="who">
        <span className="av" style={c?avStyle(c.name):{background:"var(--ink)",color:"#fff"}}>
          {c?initial(c.name):<I n={q.type==="learn"?"book":q.type==="add"?"plus":"mic"} s={19}/>}</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:13.5,fontWeight:800,color:"var(--ink2)"}}>{q.sub}</div>
          {c&&<div className="tiny">접촉 {c.touches||0}/{TOUCH_GOAL}회 · 계약까지 평균 8회예요</div>}
        </div>
        {c&&<button className="chip" style={{padding:"6px 10px"}} onClick={()=>nav({n:"customer",id:c.id})}>카드</button>}
      </div>
      <h3>{q.title}</h3>
      <div className="why">{q.late>0&&<React.Fragment><span className="late">{q.late}일 지남</span><span className="dot"/></React.Fragment>}
        <span>{q.why}</span>{q.channel&&<React.Fragment><span className="dot"/><span>{q.channel}</span></React.Fragment>}</div>

      {(q.type==="task"&&q.script)||(q.type==="reach")?(
        <div className="script">
          <div className="sh">이대로 보내보세요</div>
          <p>{q.type==="reach"?stageScript(c,db.profile.name):q.script}</p>
          <div className="row2">
            <button className="btn quiet sm" style={{flex:1}}
              onClick={()=>copy(q.type==="reach"?stageScript(c,db.profile.name):q.script)}><I n="copy" s={16}/>복사</button>
            {c&&c.phone&&<a className="btn line sm" style={{flex:1,textDecoration:"none"}} href={`sms:${c.phone}`}><I n="msg" s={16}/>문자</a>}
            {c&&c.phone&&<a className="btn line sm" style={{flex:1,textDecoration:"none"}} href={`tel:${c.phone}`}><I n="phone" s={16}/>전화</a>}
          </div>
        </div>):null}

      {q.type==="learn"&&(<div className="script">
        <div className="sh">핵심 3가지</div>
        {q.lesson.p.map((p,n)=><div className="point" key={n}><b>{n+1}</b><span>{p}</span></div>)}
        <div className="sh" style={{marginTop:4}}>오늘 해볼 것</div>
        <p style={{margin:0,fontWeight:700,color:"var(--ink)"}}>{q.lesson.x}</p>
      </div>)}

      {q.type==="stale"&&c&&(<div className="script">
        <div className="sh">어느 단계로 옮길까요?</div>
        <div className="chips">
          {STAGES.filter(s=>s.k!==c.stage).map(s=>(
            <button key={s.k} className="chip" onClick={()=>moveStage(c,s.k)}>{s.n}</button>))}
        </div>
      </div>)}
    </div>

    {/* 액션 */}
    {q.type==="task"&&(<React.Fragment>
      <button className="btn dark" onClick={()=>finishTask(q.task)}><I n="check" s={19}/>했어요</button>
      <div className="row2">
        <button className="btn line" onClick={()=>delay(q.task,1)}>내일로</button>
        <button className="btn line" onClick={()=>delay(q.task,3)}>3일 뒤로</button>
      </div></React.Fragment>)}

    {q.type==="reach"&&(<React.Fragment>
      <button className="btn dark" onClick={()=>contact(c,"연락")}><I n="check" s={19}/>연락했어요</button>
      <div className="row2">
        <button className="btn line" onClick={()=>{ save2(d=>({...d,customers:d.customers.map(x=>x.id!==c.id?x:
            ({...x,nextContact:addDays(today(),2)}))})); notify("이틀 뒤에 다시 알려드릴게요"); advance(); }}>이틀 뒤로</button>
        <button className="btn line" onClick={()=>moveStage(c,"hold")}>보류로</button>
      </div></React.Fragment>)}

    {q.type==="learn"&&(<React.Fragment>
      <button className="btn dark" onClick={()=>learnDone(q.lesson)}><I n="check" s={19}/>배웠어요</button>
      {q.lesson.s&&<button className="btn line" onClick={()=>copy(q.lesson.s)}><I n="copy" s={18}/>예시 문장 복사</button>}
    </React.Fragment>)}

    {q.type==="add"&&<button className="btn dark" onClick={()=>nav({n:"addcust"})}><I n="plus" s={19}/>지금 등록하기</button>}
    {q.type==="record"&&<button className="btn dark" onClick={()=>nav({n:"record"})}><I n="mic" s={19}/>지금 기록하기</button>}

    {c&&<button className="btn line" onClick={()=>nav({n:"coach",id:c.id})}><I n="msg" s={18}/>어떻게 말할지 코치와 상의</button>}
    <button className="btn quiet" onClick={()=>{skipStep(q.k);advance();}}>오늘은 건너뛰기</button>
    {!pro&&i>0&&i%2===0&&<AdSlot pro={pro} onUpgrade={()=>upgrade()}/>}
  </div>);
}

/* ══════════════════════════════════════════════════════════════
   13. 고객 목록 / 상세
   ══════════════════════════════════════════════════════════════ */
function Customers({db,nav,pro,upgrade,notify}){
  const [f,setF]=useState("all");
  const [qs,setQs]=useState("");
  const cs=db.customers.map(enrich);
  const unit=lbl(db);
  const filtered=cs.filter(c=>{
    if(qs&&!(c.name+(c.org||"")+(c.memo||"")).toLowerCase().includes(qs.toLowerCase())) return false;
    if(f==="all") return true;
    if(f==="overdue") return c.overdue&&c.stage!=="won";
    return c.stage===f;
  }).sort((a,b)=>rank(b)-rank(a));
  const cnt=k=>k==="all"?cs.length:k==="overdue"?cs.filter(c=>c.overdue&&c.stage!=="won").length:cs.filter(c=>c.stage===k).length;
  const full=!pro&&db.customers.length>=PLAN.free.customers;
  return (<div className="pad">
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",paddingTop:"calc(20px + env(safe-area-inset-top,0px))"}}>
      <div><h1 className="h1" style={{margin:"0 0 4px"}}>{unit} {cs.length}명</h1>
        <p className="tiny">급한 순서로 정렬돼요{!pro&&` · 무료 ${PLAN.free.customers}명까지`}</p></div>
      <button className="btn dark sm" style={{width:"auto",padding:"11px 15px"}}
        onClick={()=>full?upgrade(`무료는 ${unit} ${PLAN.free.customers}명까지 등록할 수 있어요`):nav({n:"addcust"})}>
        <I n="plus" s={17}/>등록</button>
    </div>
    <input className="inp" style={{margin:"16px 0 12px"}} placeholder="이름 · 소속 · 메모 검색"
      value={qs} onChange={e=>setQs(e.target.value)}/>
    <div className="chips scroll" style={{marginBottom:16}}>
      <button className={f==="all"?"chip on":"chip"} onClick={()=>setF("all")}>전체 {cnt("all")}</button>
      <button className={f==="overdue"?"chip on":"chip"} onClick={()=>setF("overdue")}
        style={f!=="overdue"&&cnt("overdue")?{color:"var(--warn)",borderColor:"#F0C9C1"}:null}>지연 {cnt("overdue")}</button>
      {STAGES.map(s=><button key={s.k} className={f===s.k?"chip on":"chip"} onClick={()=>setF(s.k)}>{s.n} {cnt(s.k)}</button>)}
    </div>
    {full&&<Locked text={`무료는 ${PLAN.free.customers}명까지예요. 무제한으로 늘리기`} onClick={()=>upgrade()}/>}
    <div className="list">
      {filtered.map(c=><CustRow key={c.id} c={c} go={()=>nav({n:"customer",id:c.id})}/>)}
      {filtered.length===0&&(<div className="blank">
        {cs.length===0?<React.Fragment>아직 등록된 {unit}이 없어요.<br/>이름만 알아도 등록할 수 있습니다.</React.Fragment>
          :"조건에 맞는 분이 없어요."}
        <button className="btn dark" style={{marginTop:18}} onClick={()=>nav({n:"addcust"})}>{unit} 등록하기</button>
      </div>)}
    </div>
    <AdSlot pro={pro} onUpgrade={()=>upgrade()}/>
  </div>);
}

function Detail({db,save2,nav,notify,pushHist,id,pro,upgrade}){
  const raw=db.customers.find(x=>x.id===id);
  if(!raw) return <div className="pad"><div className="blank">삭제된 고객이에요.</div></div>;
  const c=enrich(raw);
  const tasks=db.tasks.filter(t=>t.customerId===id&&!t.done);
  const recs=db.records.filter(r=>r.customerId===id);
  const hist=(c.history||[]);
  const patch=o=>save2(d=>({...d,customers:d.customers.map(x=>x.id===id?{...x,...o}:x)}));
  const setStage=k=>{ patch({stage:k,nextContact:addDays(today(),SK[k].cad)});
    pushHist(id,{kind:"stage",text:`${c.st.n} → ${SK[k].n}`}); notify(`${SK[k].n} 단계로 옮겼어요`); };
  const copy=t=>{ try{navigator.clipboard.writeText(t);}catch(e){} notify("복사했어요"); };
  const listTag=a=>(a||[]).map(x=>x.tag+(x.count>1?` (${x.count})`:"")).join(", ");
  const del=()=>{ if(!confirm(`${c.name}님을 삭제할까요?`))return;
    save2(d=>({...d,customers:d.customers.filter(x=>x.id!==id),tasks:d.tasks.filter(t=>t.customerId!==id)}));
    notify("삭제했어요"); nav({n:"customers"}); };
  return (<div className="pad" style={{paddingBottom:40}}>
    <button className="back" onClick={()=>nav({n:"customers"})}><I n="back" s={18}/>{lbl(db)} 목록</button>
    <div style={{display:"flex",gap:14,alignItems:"center",margin:"8px 0 18px"}}>
      <span className="av" style={{...avStyle(c.name),width:54,height:54,borderRadius:17,fontSize:21}}>{initial(c.name)}</span>
      <div style={{flex:1,minWidth:0}}>
        <h1 className="h1" style={{margin:0,fontSize:24}}>{c.name}</h1>
        <div className="tiny">{[c.org,c.source].filter(Boolean).join(" · ")||"메모 없음"}</div>
      </div>
    </div>

    <div className="row2">
      {c.phone&&<a className="btn dark sm" style={{flex:1,textDecoration:"none"}} href={`tel:${c.phone}`}><I n="phone" s={17}/>전화</a>}
      {c.phone&&<a className="btn line sm" style={{flex:1,textDecoration:"none"}} href={`sms:${c.phone}`}><I n="msg" s={17}/>문자</a>}
      <button className="btn line sm" style={{flex:1}} onClick={()=>nav({n:"coach",id})}><I n="spark" s={17}/>코치</button>
    </div>

    <div className="card" style={{marginTop:12}}>
      <span className="eyebrow">지금 단계</span>
      <div className="chips" style={{margin:"10px 0 4px"}}>
        {STAGES.map(s=><button key={s.k} className={c.stage===s.k?"chip on":"chip"} onClick={()=>setStage(s.k)}>{s.n}</button>)}
      </div>
      <div className="tiny" style={{marginTop:8,lineHeight:1.6}}>{c.st.d} → <b style={{color:"var(--ink2)"}}>{c.st.act}</b></div>
      <div style={{marginTop:14,paddingTop:14,borderTop:"1px solid var(--line2)"}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:7}}>
          <span className="tiny">접촉 {c.touches||0}회</span><span className="tiny">계약까지 평균 {TOUCH_GOAL}회</span></div>
        <div className="bar"><i style={{width:`${Math.min(100,(c.touches||0)/TOUCH_GOAL*100)}%`,background:c.st.c}}/></div>
      </div>
    </div>

    <div className="card">
      <span className="eyebrow">연락 시점</span>
      <div style={{fontSize:17,fontWeight:800,letterSpacing:"-.02em",marginTop:8,
        color:c.overdue?"var(--warn)":"var(--ink)"}}>
        {c.since==null?"아직 연락 기록이 없어요":c.overdue?`${c.due}일 지났어요 · 지금 연락하세요`:
         c.due===0?"오늘이 연락할 날이에요":`${-c.due}일 뒤에 연락하면 돼요`}</div>
      <div className="tiny" style={{marginTop:4}}>
        {c.st.n} 단계 권장 주기는 {c.st.cad}일{c.lastContact?` · 마지막 연락 ${fmtL(c.lastContact)}`:""}</div>
      <div className="row2" style={{marginTop:14,marginBottom:0}}>
        <button className="btn dark sm" style={{flex:1}} onClick={()=>{
          patch({lastContact:today(),touches:(c.touches||0)+1,nextContact:addDays(today(),c.st.cad)});
          pushHist(id,{kind:"contact",text:"연락함"}); notify("연락을 기록했어요"); }}>연락 기록</button>
        <button className="btn line sm" style={{flex:1}} onClick={()=>copy(stageScript(c,db.profile.name))}>대본 복사</button>
      </div>
    </div>

    <div className="card">
      <span className="eyebrow">관심도</span>
      <div className="stars" style={{margin:"9px 0 16px"}}>
        {[1,2,3,4,5].map(n=><button key={n} className={(c.temp||3)>=n?"on":""}
          onClick={()=>patch({temp:n})}><I n="star" s={15}/></button>)}
      </div>
      {c.phone&&<div className="kv"><span>연락처</span><b>{c.phone}</b></div>}
      {c.source&&<div className="kv"><span>알게 된 곳</span><b>{c.source}</b></div>}
      {c.needs&&<div className="kv"><span>필요한 것</span><b>{c.needs}</b></div>}
      {c.decider&&<div className="kv"><span>결정하는 분</span><b>{c.decider}</b></div>}
      {c.value>0&&<div className="kv"><span>예상 금액</span><b>{won(c.value)}</b></div>}
      {(c.cares||[]).length>0&&<div className="kv"><span>신경 쓰는 것</span><b>{listTag(c.cares)}</b></div>}
      {(c.objections||[]).length>0&&<div className="kv"><span>망설인 이유</span><b className="warn">{listTag(c.objections)}</b></div>}
      {(c.works||[]).length>0&&<div className="kv"><span>통했던 방식</span><b>{listTag(c.works)}</b></div>}
      {c.memo&&<div className="kv"><span>메모</span><b style={{fontWeight:600,color:"var(--ink2)"}}>{c.memo}</b></div>}
    </div>

    {tasks.length>0&&(<React.Fragment><div className="h2"><span>할 일 {tasks.length}</span></div>
      <div className="list">{tasks.map(t=>(<div className="item" key={t.id} style={{cursor:"default"}}>
        <span className="av" style={{background:"var(--line2)",color:"var(--ink3)"}}><I n="flag" s={18}/></span>
        <span className="mid"><b>{t.title}</b><span className="l2">{fmtL(t.due)} · {t.channel}</span></span>
        <button className="chip" onClick={()=>{ save2(d=>({...d,tasks:d.tasks.map(x=>x.id===t.id?{...x,done:true,doneAt:today()}:x)}));
          notify("완료했어요"); }}>완료</button></div>))}</div></React.Fragment>)}

    <div className="h2"><span>기록</span>
      <span className="more" onClick={()=>nav({n:"record",id})}>추가<I n="plus" s={14}/></span></div>
    {(recs.length||hist.length)?(<div className="card"><div className="timeline">
      {recs.map(r=>(<div className="tl hot" key={r.id}>
        <div className="d">{fmtL(r.date)}</div><div className="t">{r.summary}</div>
        {r.praise&&<div className="x">👏 {r.praise}</div>}
        {r.miss&&<div className="x" style={{color:"#8F6410"}}>🔍 {r.miss}</div>}</div>))}
      {hist.map(h=>(<div className="tl" key={h.id}>
        <div className="d">{fmtL(h.date)}</div><div className="t">{h.text}</div></div>))}
    </div></div>):<div className="blank">아직 기록이 없어요.<br/>만난 이야기를 남기면 다음 할 일이 만들어져요.</div>}
    <button className="ghostlink" onClick={del}>이 {lbl(db)} 삭제하기</button>
  </div>);
}

/* ══════════════════════════════════════════════════════════════
   14. 고객 등록 — 한 화면에 질문 하나
   ══════════════════════════════════════════════════════════════ */
function AddCustomer({db,save2,nav,notify,pro,upgrade}){
  const unit=lbl(db);
  const [s,setS]=useState(0);
  const [f,setF]=useState({name:"",org:"",phone:"",source:"",needs:"",stage:"new",temp:3,value:0,memo:""});
  const set=o=>setF({...f,...o});
  const dict=useDictation(t=>set({needs:t}));
  if(!pro&&db.customers.length>=PLAN.free.customers){
    return (<div className="pad"><button className="back" onClick={()=>nav({n:"customers"})}><I n="back" s={18}/>뒤로</button>
      <div className="card center"><div style={{color:"var(--gold)",marginBottom:12}}><I n="lock" s={30}/></div>
        <h2 className="h1" style={{fontSize:21}}>무료는 {PLAN.free.customers}명까지예요</h2>
        <p className="sub">프로로 바꾸면 {unit}을 무제한으로 등록할 수 있어요.</p>
        <button className="btn gold" onClick={()=>upgrade()}>프로 살펴보기</button></div></div>);
  }
  const done=()=>{
    const id=uid();
    save2(d=>({...d,customers:[{id,name:f.name.trim(),org:f.org.trim(),phone:f.phone.trim(),source:f.source,
      needs:f.needs.trim(),memo:f.memo.trim(),stage:f.stage,temp:f.temp,value:+f.value||0,
      createdAt:today(),lastContact:f.stage==="new"?null:today(),touches:f.stage==="new"?0:1,
      nextContact:addDays(today(),SK[f.stage].cad),cares:[],objections:[],works:[],
      history:[{id:uid(),date:today(),kind:"add",text:`${unit}으로 등록`}]},...d.customers]}));
    notify(`${f.name}님을 등록했어요`); nav({n:"customer",id});
  };
  const steps=[
   {t:`${unit}의 이름을 알려주세요`,d:"이름만 알아도 시작할 수 있어요. 나머지는 나중에 채워도 됩니다.",
    ok:()=>f.name.trim().length>0,
    body:(<React.Fragment>
      <div className="field"><label className="label">이름 *</label>
        <input className="inp" autoFocus value={f.name} onChange={e=>set({name:e.target.value})} placeholder="예) 김성호"/></div>
      <div className="field"><label className="label">소속 · 하는 일</label>
        <input className="inp" value={f.org} onChange={e=>set({org:e.target.value})} placeholder="예) 성호헬스케어 대표"/></div>
      <div className="field"><label className="label">연락처</label>
        <input className="inp" type="tel" value={f.phone} onChange={e=>set({phone:e.target.value})} placeholder="010-0000-0000"/></div>
    </React.Fragment>)},
   {t:"어떻게 알게 되셨어요?",d:"알게 된 경로에 따라 접근 방법이 달라져요.",ok:()=>true,
    body:(<div className="chips">{SOURCES.map(x=>(
      <button key={x} className={f.source===x?"chip on":"chip"} onClick={()=>set({source:x})}>{x}</button>))}</div>)},
   {t:"지금 어느 단계인가요?",d:"정확하지 않아도 괜찮아요. 언제든 바꿀 수 있습니다.",ok:()=>true,
    body:(<div className="list">{STAGES.filter(x=>x.k!=="hold").map(x=>(
      <button key={x.k} className="item" onClick={()=>set({stage:x.k})}
        style={f.stage===x.k?{boxShadow:"0 0 0 2px var(--ink)"}:null}>
        <span className="av" style={{background:x.c+"1A",color:x.c}}><I n="flag" s={18}/></span>
        <span className="mid"><b>{x.n}</b><span className="l2">{x.d} · {x.cad}일마다 연락</span></span>

          onChange={e=>set({value:e.target.value})} placeholder="예) 300000"/></div>

   {t:"얼마나 관심 있어 보이세요?",d:"관심도가 높을수록 먼저 알려드려요.",ok:()=>true,
    body:(<React.Fragment>

      </div>
      <div className="field"><label className="label">메모 (선택)</label>
        <input className="inp" value={f.memo} onChange={e=>set({memo:e.target.value})} placeholder="예) 아침에 통화 편하다고 하심"/></div>
    </React.Fragment>)},
  ];
  const cur=steps[s];
  return (<div className="pad" style={{paddingBottom:40}}>
    <div className="flowtop">
      <button className="back" onClick={()=>s===0?nav({n:"customers"}):setS(s-1)}><I n="back" s={18}/></button>
      <div className="steps">{steps.map((_,n)=><i key={n} className={n<=s?"on":""}/>)}</div>

}

    const prompt=`당신은 따뜻하지만 정확한 한국 영업·고객관리 코치입니다. 쉬운 말과 존댓말을 쓰세요.

tasks는 1~2개만. 없는 사실을 지어내지 마세요.`;
    try{ const raw=await askAI(prompt); spendAI();

  const commit=()=>{

        n.cares=bump(n.cares,r.cares); n.objections=bump(n.objections,r.objections); n.works=bump(n.works,r.works);
        n.history=[{id:uid(),date:today(),kind:"record",text:r.summary.slice(0,60)},...(n.history||[])];

      {res.pattern&&<div className="coach c-pat"><div className="ch">📌 반복되는 패턴</div><p>{res.pattern}</p></div>}
      <button className="btn dark" style={{marginTop:8}} onClick={commit}>

    {s===5&&saved&&(<div className="done">
      <div className="bigck"><I n="check" s={32}/></div>
      <h1 className="h1">{db.streak.count}일째 기록하셨어요</h1>
      <p className="sub">오늘의 실행에 {saved.n}개가 들어갔어요.<br/>하나씩만 하면 됩니다.</p>

      <button className="btn line" onClick={()=>nav({n:"home"})}>홈으로</button>
    </div>)}
  </div>);
}
function collectTags(db,which){
  const map={};
  db.records.forEach(r=>((which==="w"?r.weaknessTags:r.strengthTags)||[]).forEach(t=>{
    if(typeof t!=="string")return; map[t]=(map[t]||0)+1; }));
  return Object.keys(map).map(t=>({tag:t,count:map[t]})).sort((a,b)=>b.count-a.count);
}

[필요한 것] ${c.needs||"확인 안 됨"}

[망설인 이유] ${(c.objections||[]).map(o=>`${o.tag}(${o.count}회)`).join(", ")||"없음"}

    const sys=`당신은 한국의 영업·고객관리 코치입니다. 사용자는 나이가 있을 수 있으니 쉬운 말, 존댓말, 짧게 답하세요.
답변은 4~7줄. 실제로 쓸 문장은 따옴표로 감싸 제시하세요. 설교하지 말고 바로 실행할 수 있게 주세요.

${ctx}
[사용자가 반복해온 약점] ${weak}

질문: ${question}`;
    try{ const hist=msgs.slice(-6).map(m=>({role:m.role,content:m.content}));
      const a=await askAI(sys,hist); spendAI();
      persist([...next,{role:"assistant",content:a.trim()}]);
    }catch(e){ persist([...next,{role:"assistant",content:offlineChat(question)}]); }
    finally{ setBusy(false); }
  };
  const chips=c?CHIPS_C:CHIPS_G;
  return (<div className="chatwrap">
    <div className="chathead">
      <button className="back" style={{padding:0}} onClick={()=>nav(c?{n:"customer",id}:{n:"home"})}><I n="back" s={20}/></button>
      <span className="av" style={c?avStyle(c.name):{background:"var(--ink)",color:"#fff"}}>
        {c?initial(c.name):<I n="spark" s={19}/>}</span>
      <div style={{flex:1,minWidth:0}}>
        <b>{c?`${c.name}님 대응 코치`:"AI 코치"}</b>
        <span>{c?`${c.st.n} 단계 · ${c.st.act}`:pro?"무엇이든 물어보세요":`오늘 ${aiLeft}회 남음`}</span></div>
      {!pro&&<button className="chip" style={{padding:"6px 10px"}} onClick={()=>upgrade()}><I n="crown" s={13}/></button>}
    </div>
    <div className="chatlog" ref={logRef}>
      {msgs.length===0&&(<div className="bub ai">
        {c?`${c.name}님 건으로 무엇이든 물어보세요.\n\n고객이 실제로 한 말을 그대로 적어주시면, 뭐라고 답할지 문장으로 만들어 드릴게요.`
          :`무엇이든 물어보세요.\n\n고객을 어디서 찾을지, 첫 연락은 뭐라고 할지, 거절을 어떻게 넘길지까지 도와드립니다.\n\n말로 물어보셔도 돼요.`}</div>)}
      {msgs.map((m,n)=>(<div key={n} className={m.role==="user"?"bub me":"bub ai"}
        onClick={()=>m.role==="assistant"&&speak(m.content)}>{m.content}</div>))}
      {busy&&<div className="bub ai think">코치가 생각하는 중이에요…</div>}
    </div>
    {dict.on&&dict.interim&&<div className="interim" style={{margin:"0 13px"}}>{dict.interim}</div>}
    {dict.err&&<div className="err" style={{margin:"0 13px 8px"}}>{dict.err}</div>}
    {!pro&&aiLeft<=0&&(<div style={{padding:"0 13px 8px"}}>
      <button className="btn line sm" onClick={rewardAd}><I n="spark" s={16}/>광고 보고 {ADS.rewardAiCalls}회 더 받기</button></div>)}
    <div className="chips scroll" style={{padding:"6px 13px"}}>
      {chips.map(ch=><button className="chip" key={ch} onClick={()=>send(ch)}>{ch}</button>)}</div>
    <div className="chatbar">
      <button className={dict.on?"micbtn on":"micbtn"} onClick={()=>dict.on?dict.stop():dict.start(text)}>
        <I n={dict.on?"stop":"mic"} s={19}/></button>
      <textarea className="chatin" rows={1} value={text} placeholder={dict.on?"듣고 있어요…":"무엇이든 물어보세요"}
        onChange={e=>setText(e.target.value)}
        onKeyDown={e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();} }}/>
      <button className="send" onClick={()=>send()} disabled={busy||!text.trim()}><I n="send" s={19}/></button>
    </div>
  </div>);
}

/* ══════════════════════════════════════════════════════════════
   17. 콘텐츠 만들기
   ══════════════════════════════════════════════════════════════ */
const KINDS=[{k:"sns",t:"SNS 게시글",s:"인스타·블로그·스레드",ic:"pen"},
 {k:"dm",t:"메시지 · 카톡",s:"고객에게 바로 보낼 글",ic:"msg"},
 {k:"offer",t:"제안서 초안",s:"무엇을·얼마에·언제부터",ic:"flag"},
 {k:"edu",t:"교육 자료",s:"팀·고객에게 나눠줄 자료",ic:"book"}];
function Content({db,save2,nav,notify,canAI,spendAI,pro,upgrade,aiLeft}){
  const [s,setS]=useState(1);
  const [kind,setKind]=useState("sns");
  const [topic,setTopic]=useState("");
  const [target,setTarget]=useState("40~50대 직장인");
  const [out,setOut]=useState(""); const [busy,setBusy]=useState(false); const [off,setOff]=useState(false);
  const dict=useDictation(setTopic);
  const gen=async()=>{
    if(!topic.trim()){notify("주제를 적어주세요");return;}
    if(!canAI()){ setOut(offlineContent(kind,topic,target)); setOff(true); setS(3); return; }
    setBusy(true); setOff(false);
    const kt=KINDS.find(x=>x.k===kind).t;
    const rule=kind==="sns"?"200~350자. 첫 줄이 눈길을 끌어야 합니다. 해시태그 3~5개를 마지막에."
      :kind==="dm"?"3~5줄. 부담스럽지 않게, 강요 없이. 이모지는 최대 1개."
      :kind==="offer"?"제목 + 3개 항목(지금 상황 / 제안 / 시작 방법). 각 2~3줄."
      :"제목과 3개 항목. 각 항목 2~3줄. 마지막에 '오늘 해볼 것' 한 줄.";
    const prompt=`당신은 한국의 ${JOBMAP[db.profile.job].n} 분야 콘텐츠 작가입니다. ${kt}을 하나 써주세요.

주제: ${topic}
읽는 사람: ${target}
형식: ${rule}

중요:
- 효과·수익을 단정하거나 과장하는 표현 금지 (광고 규정).
- 파는 글이 아니라 경험을 나누는 어조로.
- 설명 없이 본문만 출력하세요.`;
    try{ const a=await askAI(prompt); spendAI(); setOut(a.trim()); }
    catch(e){ setOut(offlineContent(kind,topic,target)); setOff(true); }
    finally{ setBusy(false); setS(3); }
  };
  return (<div className="pad" style={{paddingBottom:40}}>
    <div className="flowtop">
      <button className="back" onClick={()=>s===1?nav({n:"home"}):setS(s-1)}><I n="back" s={18}/></button>
      <div className="steps">{[1,2,3].map(n=><i key={n} className={n<=s?"on":""}/>)}</div>
      {!pro&&<span className="tiny">AI {aiLeft}회</span>}
    </div>
    {s===1&&(<React.Fragment>
      <h1 className="h1">무엇을 만들까요?</h1>
      <p className="sub">AI가 초안을 만들어요. 고쳐서 쓰시면 됩니다.</p>
      <div className="list">{KINDS.map(x=>(
        <button key={x.k} className="item" style={{padding:16}} onClick={()=>{setKind(x.k);setS(2);}}>
          <span className="av" style={{background:"var(--line2)",color:"var(--ink2)"}}><I n={x.ic} s={19}/></span>
          <span className="mid"><b>{x.t}</b><span className="l2">{x.s}</span></span>
          <I n="chev" s={17} c="var(--ink4)"/></button>))}</div>
    </React.Fragment>)}
    {s===2&&(<React.Fragment>
      <h1 className="h1">어떤 내용인가요?</h1>
      <p className="sub">한 줄이면 충분해요.</p>
      <input className="inp" value={topic} onChange={e=>setTopic(e.target.value)}
        placeholder="예) 3개월 동안 꾸준히 해본 후기"/>
      <button className="btn line" style={dict.on?{marginTop:10,borderColor:"var(--warn)",color:"var(--warn)"}:{marginTop:10}}
        onClick={()=>dict.on?dict.stop():dict.start(topic)}>
        <I n={dict.on?"stop":"mic"} s={18}/>{dict.on?"듣는 중… 누르면 멈춰요":"말로 입력하기"}</button>
      {dict.interim&&<div className="interim">{dict.interim}</div>}
      <label className="label" style={{marginTop:14}}>읽는 사람</label>
      <div className="chips" style={{marginBottom:18}}>
        {["40~50대 직장인","60대 이상","젊은 부모","사업에 관심 있는 분","기존 고객","20~30대"].map(t=>
          <button key={t} className={target===t?"chip on":"chip"} onClick={()=>setTarget(t)}>{t}</button>)}
      </div>
      <button className="btn dark" onClick={gen} disabled={busy}>{busy?"만드는 중이에요…":"만들기"}</button>
    </React.Fragment>)}
    {s===3&&(<React.Fragment>
      <h1 className="h1">{KINDS.find(x=>x.k===kind).t}</h1>
      {off&&<div className="tagpill" style={{display:"inline-block",marginBottom:10}}>간단 생성 모드</div>}
      <div className="card"><p style={{whiteSpace:"pre-wrap",margin:0,fontSize:15.5,lineHeight:1.85}}>{out}</p></div>
      <div className="note">그대로 올리면 티가 나요. <b>내 경험 한 줄</b>을 꼭 넣어 고쳐 쓰세요.</div>
      <button className="btn dark" onClick={()=>{try{navigator.clipboard.writeText(out);}catch(e){} notify("복사했어요");}}>
        <I n="copy" s={18}/>복사하기</button>
      <div className="row2">
        <button className="btn line" onClick={gen} disabled={busy}><I n="refresh" s={17}/>다시</button>
        <button className="btn line" onClick={()=>{ save2(d=>({...d,contents:[{id:uid(),kind,topic,target,out,date:today()},...d.contents]}));
          notify("저장했어요"); }}>저장</button>
      </div>
      <AdSlot pro={pro} onUpgrade={()=>upgrade()}/>
      {db.contents.length>0&&(<React.Fragment><div className="h2"><span>저장한 콘텐츠</span></div>
        <div className="list">{db.contents.slice(0,6).map(x=>(<div className="item" key={x.id} style={{cursor:"default"}}>
          <span className="av" style={{background:"var(--line2)",color:"var(--ink3)"}}><I n="pen" s={18}/></span>
          <span className="mid"><b>{x.topic}</b><span className="l2">{(KINDS.find(k=>k.k===x.kind)||{}).t} · {fmtL(x.date)}</span></span>
          <button className="chip" onClick={()=>{try{navigator.clipboard.writeText(x.out);}catch(e){} notify("복사했어요");}}>복사</button>
        </div>))}</div></React.Fragment>)}
    </React.Fragment>)}
  </div>);
}

/* ══════════════════════════════════════════════════════════════

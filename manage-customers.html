function Learn({db,nav,pro,upgrade}){
  const [open,setOpen]=useState("t1");
  const done=new Set(db.learned);
  const pct=Math.round(db.learned.length/LESSON_TOTAL*100);
  return (<div className="pad" style={{paddingBottom:40}}>
    <button className="back" onClick={()=>nav({n:"home"})}><I n="back" s={18}/>홈</button>
    <h1 className="h1">교육센터</h1>
    <p className="sub">고객을 만들고 넓혀가는 전 과정을, 하루 한 과씩.</p>
    <div className="card">
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:9}}>
        <b style={{fontSize:15,fontWeight:800}}>{db.learned.length} / {LESSON_TOTAL}과 완료</b>
        <span className="tiny num">{pct}%</span></div>
      <div className="bar"><i style={{width:pct+"%",background:"linear-gradient(90deg,#B98B2E,#D9BE86)"}}/></div>
    </div>
    {TRACKS.map(tr=>{ const n=tr.lessons.filter(l=>done.has(l.id)).length;
      const locked=tr.pro&&!pro;
      return (<div className="track" key={tr.id}>
        <div className="trackh" onClick={()=>locked?upgrade("2·3단계 과정은 프로에서 열려요"):setOpen(open===tr.id?null:tr.id)}>
          <span className="trackic" style={{background:tr.bg,color:tr.c}}><I n={tr.icon} s={20}/></span>
          <div style={{flex:1,minWidth:0}}>
            <b>{tr.name}{locked&&<span className="tagpill gold" style={{marginLeft:7}}>프로</span>}</b>
            <span>{tr.sub} · {n}/{tr.lessons.length}과</span>
            <div className="bar" style={{marginTop:7}}><i style={{width:`${n/tr.lessons.length*100}%`,background:tr.c}}/></div>
          </div>
          <I n={locked?"lock":open===tr.id?"chevd":"chev"} s={17} c="var(--ink4)"/>
        </div>
        {open===tr.id&&!locked&&tr.lessons.map(l=>(
          <div className="lesson" key={l.id} onClick={()=>nav({n:"lesson",id:l.id})}>
            <span className={done.has(l.id)?"ck on":"ck"}>{done.has(l.id)&&<I n="check" s={12}/>}</span>
            <span style={{flex:1,minWidth:0}}><b>{l.t}</b><span>{l.d}</span></span>
            <I n="chev" s={16} c="var(--ink4)"/></div>))}
      </div>); })}
    <button className="item" style={{marginTop:6}} onClick={()=>nav({n:"plays"})}>
      <span className="av" style={{background:"var(--bluebg)",color:"var(--blue)"}}><I n="msg" s={19}/></span>
      <span className="mid"><b>상황별 대본</b><span className="l2">첫 연락 · 거절 · 가격 · 소개 등 {PLAYBOOKS.length}종</span></span>
      <I n="chev" s={17} c="var(--ink4)"/></button>
    <AdSlot pro={pro} onUpgrade={()=>upgrade()}/>
  </div>);
}
function Lesson({db,save2,nav,notify,id,pro,upgrade}){
  const tr=TRACKS.find(t=>t.lessons.some(l=>l.id===id));
  if(!tr) return null;
  const l=tr.lessons.find(x=>x.id===id);
  const done=db.learned.indexOf(id)>=0;
  const toggle=()=>{ save2(d=>({...d,learned:done?d.learned.filter(x=>x!==id):[...d.learned,id]}));
    notify(done?"완료를 취소했어요":"한 과 끝냈어요 👏"); if(!done) nav({n:"learn"}); };
  return (<div className="pad" style={{paddingBottom:40}}>
    <button className="back" onClick={()=>nav({n:"learn"})}><I n="back" s={18}/>{tr.name}</button>
    <h1 className="h1">{l.t}</h1>
    <div style={{display:"flex",alignItems:"center",marginBottom:14}}>
      <p className="sub" style={{margin:0,flex:1}}>{l.d}</p>
      <button className="speak" onClick={()=>speak(`${l.t}. ${l.p.join(" ")}`)}><I n="speaker" s={15}/>읽어주기</button>
    </div>
    <div className="card">{l.p.map((p,n)=><div className="point" key={n}><b>{n+1}</b><span>{p}</span></div>)}</div>
    {l.s&&(<div className="card">
      <span className="eyebrow">이렇게 말해보세요</span>
      <p style={{margin:"10px 0 12px",fontSize:15.5,lineHeight:1.8,fontWeight:700,whiteSpace:"pre-wrap"}}>{l.s}</p>
      <button className="btn quiet sm" onClick={()=>{try{navigator.clipboard.writeText(l.s);}catch(e){} notify("복사했어요");}}>
        <I n="copy" s={16}/>복사</button></div>)}
    <div className="card gold">
      <span className="eyebrow">오늘 해볼 것</span>
      <div style={{fontSize:16.5,fontWeight:800,lineHeight:1.65,marginTop:8,letterSpacing:"-.02em"}}>{l.x}</div>
    </div>
    <button className="btn dark" onClick={toggle}>{done?"완료 취소":"다 배웠어요"}</button>
    <button className="btn line" onClick={()=>nav({n:"coach"})}><I n="msg" s={18}/>이 내용 코치에게 더 묻기</button>
  </div>);
}
function Plays({db,nav,notify,pro,upgrade}){

          :(<React.Fragment>

    <AdSlot pro={pro} onUpgrade={()=>upgrade()}/>
  </div>);
}

        ["team","users","팀 관리",pro?`그룹원 ${db.members.length}명`:"프로 기능"],
        ["settings","chart","설정 · 내 정보","요금제 · 백업 · 초기화"]].map(([n,ic,t,s])=>(
        <button key={n} className="item" onClick={()=>n==="team"&&!pro?upgrade("팀 관리는 프로 기능이에요"):nav({n})}>
          <span className="av" style={{background:"var(--line2)",color:"var(--ink2)"}}><I n={ic} s={19}/></span>
          <span className="mid"><b>{t}</b><span className="l2">{s}</span></span>
          <I n={n==="team"&&!pro?"lock":"chev"} s={17} c="var(--ink4)"/></button>))}
    </div>
    <AdSlot pro={pro} onUpgrade={()=>upgrade()}/>
  </div>);
}

function Team({db,save2,nav,notify,pro,upgrade}){
  const [add,setAdd]=useState(false);
  const [nf,setNf]=useState({name:"",note:""});
  const ms=db.members.map(m=>{ const g=m.lastActive?gap(m.lastActive,today()):999;
    const jd=m.joined?gap(m.joined,today()):999;
    return {...m,gap:g,joinDays:jd,risk:g>7,newbie:jd<=21}; }).sort((a,b)=>b.gap-a.gap);
  const risk=ms.filter(m=>m.risk).length, cand=ms.filter(m=>m.candidate).length, nb=ms.filter(m=>m.newbie).length;
  const touch=id=>{ save2(d=>({...d,members:d.members.map(m=>m.id===id?{...m,lastActive:today(),activity:(m.activity||0)+1}:m)}));
    notify("연락을 기록했어요"); };
  const flip=id=>save2(d=>({...d,members:d.members.map(m=>m.id===id?{...m,candidate:!m.candidate}:m)}));
  const Bar2=({v,max,c})=>(<div className="bar" style={{marginTop:4}}><i style={{width:`${Math.min(100,v/max*100)}%`,background:c}}/></div>);
  return (<div className="pad" style={{paddingBottom:40}}>
    <button className="back" onClick={()=>nav({n:"growth"})}><I n="back" s={18}/>성장</button>
    <h1 className="h1">팀 관리</h1>
    <p className="sub">신입은 첫 3주, 리더 후보는 꾸준함으로 찾습니다.</p>
    <div className="stats">
      <div className="stat"><b className="num">{ms.length}</b><span>그룹원</span></div>
      <div className="stat"><b className="num" style={{color:risk?"var(--warn)":undefined}}>{risk}</b><span>연락 필요</span></div>
      <div className="stat"><b className="num" style={{color:"var(--gold)"}}>{cand}</b><span>리더 후보</span></div>
    </div>
    {nb>0&&<div className="note">합류 3주 안쪽인 분이 {nb}명 있어요. 이 시기에 작은 성공 하나를 만들어 주세요.</div>}
    {ms.map(m=>(<div className="card" key={m.id}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <span className="av" style={avStyle(m.name)}>{initial(m.name)}</span>
        <b style={{flex:1,fontSize:16,fontWeight:800}}>{m.name}</b>
        {m.newbie&&<span className="tagpill blue">신입 {m.joinDays}일차</span>}
        {m.candidate&&<span className="tagpill gold">리더 후보</span>}
        <span className={m.risk?"tagpill warn":"tagpill good"}>{m.gap>900?"기록 없음":`${m.gap}일 전`}</span>
      </div>
      {m.note&&<div className="tiny" style={{marginTop:9}}>{m.note}</div>}
      <div style={{display:"flex",gap:10,marginTop:12}}>
        <div style={{flex:1}}><span className="tiny">활동 {m.activity||0}</span><Bar2 v={m.activity||0} max={10} c="#2350D8"/></div>
        <div style={{flex:1}}><span className="tiny">교육 {m.lessons||0}과</span><Bar2 v={m.lessons||0} max={LESSON_TOTAL} c="#1F7A4C"/></div>
        <div style={{flex:1}}><span className="tiny">소개 {m.recruits||0}명</span><Bar2 v={m.recruits||0} max={6} c="#B98B2E"/></div>
      </div>
      <div className="row2" style={{marginTop:12,marginBottom:0}}>
        <button className="btn quiet sm" style={{flex:1}} onClick={()=>touch(m.id)}>연락했어요</button>
        <button className="btn line sm" style={{flex:1}} onClick={()=>flip(m.id)}>{m.candidate?"후보 해제":"리더 후보로"}</button>
      </div>
    </div>))}
    {ms.length===0&&<div className="blank">아직 그룹원이 없어요.<br/>함께 일하는 분을 추가해 보세요.</div>}
    {add?(<div className="card">
      <span className="eyebrow">새 그룹원</span>
      <input className="inp" style={{marginTop:10}} placeholder="이름" value={nf.name} onChange={e=>setNf({...nf,name:e.target.value})}/>
      <input className="inp" placeholder="메모 (예: 이번 주 합류)" value={nf.note} onChange={e=>setNf({...nf,note:e.target.value})}/>
      <div className="row2" style={{marginBottom:0}}>
        <button className="btn dark sm" style={{flex:1}} disabled={!nf.name.trim()} onClick={()=>{
          save2(d=>({...d,members:[...d.members,{id:uid(),name:nf.name.trim(),note:nf.note.trim(),joined:today(),
            lastActive:today(),activity:0,lessons:0,recruits:0,candidate:false}]}));
          setNf({name:"",note:""}); setAdd(false); notify("추가했어요"); }}>추가</button>
        <button className="btn line sm" style={{flex:1}} onClick={()=>setAdd(false)}>취소</button>
      </div></div>):<button className="btn line" onClick={()=>setAdd(true)}><I n="plus" s={18}/>그룹원 추가</button>}
  </div>);
}

function Settings({db,save,save2,nav,notify,pro,upgrade}){
  const cs=db.customers.map(enrich);
  const exportJson=()=>{
    if(!pro){ upgrade("데이터 내보내기는 프로 기능이에요"); return; }
    const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=`aivo-backup-${today()}.json`; a.click(); notify("백업 파일을 내려받았어요");
  };
  const share=()=>{
    const t="고객관리, 하루에 하나씩. AIVO";
    const url=window.location.href;
    if(navigator.share){ navigator.share({title:t,text:t,url}).catch(()=>{}); return; }
    try{ navigator.clipboard.writeText(`${t}\n${url}`); notify("공유 문구를 복사했어요"); }catch(e){}
  };
  return (<div className="pad" style={{paddingBottom:40}}>
    <button className="back" onClick={()=>nav({n:"growth"})}><I n="back" s={18}/>성장</button>
    <h1 className="h1">설정</h1>
    <div className={pro?"card gold":"card"}>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <span className="av" style={pro?{background:"linear-gradient(150deg,#D9BE86,#B98B2E)",color:"#241A05"}
          :{background:"var(--line2)",color:"var(--ink3)"}}><I n="crown" s={19}/></span>
        <div style={{flex:1}}><b style={{fontSize:16,fontWeight:800}}>{pro?"AIVO 프로":"무료 버전"}</b>
          <div className="tiny">{pro?"모든 기능이 열려 있어요":`고객 ${db.customers.length}/${PLAN.free.customers}명 · AI 하루 ${PLAN.free.aiPerDay}회`}</div></div>
        <button className="btn dark sm" style={{width:"auto",padding:"10px 14px"}} onClick={()=>upgrade()}>
          {pro?"관리":"업그레이드"}</button>
      </div>
      {!pro&&(<div style={{marginTop:14,paddingTop:14,borderTop:"1px solid var(--line2)"}}>
        <div className="tiny" style={{marginBottom:6}}>고객 등록 {db.customers.length} / {PLAN.free.customers}</div>
        <div className="bar"><i style={{width:`${Math.min(100,db.customers.length/PLAN.free.customers*100)}%`,
          background:db.customers.length>=PLAN.free.customers?"var(--warn)":"var(--ink)"}}/></div>
      </div>)}
    </div>
    <div className="card">
      <div className="field"><label className="label">이름</label>
        <input className="inp" value={db.profile.name} onChange={e=>save2(d=>({...d,profile:{...d.profile,name:e.target.value}}))}/></div>
      <label className="label">하는 일</label>
      <div className="chips" style={{marginBottom:14}}>
        {JOBS.map(j=><button key={j.k} className={db.profile.job===j.k?"chip on":"chip"}
          onClick={()=>save2(d=>({...d,profile:{...d.profile,job:j.k}}))}>{j.n}</button>)}
      </div>
      <label className="label">유지할 진행 중 {lbl(db)} 수 · {db.profile.goal}명</label>
      <input type="range" min="3" max="30" value={db.profile.goal} style={{width:"100%",accentColor:"#0E1420"}}
        onChange={e=>save2(d=>({...d,profile:{...d.profile,goal:+e.target.value}}))}/>
    </div>
    <div className="list">
      <button className="item" onClick={exportJson}>
        <span className="av" style={{background:"var(--line2)",color:"var(--ink2)"}}><I n="export" s={19}/></span>
        <span className="mid"><b>데이터 내보내기</b><span className="l2">기기가 바뀌어도 옮길 수 있어요</span></span>
        <I n={pro?"chev":"lock"} s={17} c="var(--ink4)"/></button>
      <button className="item" onClick={share}>
        <span className="av" style={{background:"var(--line2)",color:"var(--ink2)"}}><I n="heart" s={19}/></span>
        <span className="mid"><b>AIVO 알리기</b><span className="l2">동료에게 공유하기</span></span>
        <I n="chev" s={17} c="var(--ink4)"/></button>
    </div>
    <div className="card" style={{marginTop:12}}>
      <span className="eyebrow">저장 현황</span>
      <div className="kv" style={{marginTop:8}}><span>고객</span><b>{cs.length}명</b></div>
      <div className="kv"><span>기록</span><b>{db.records.length}건</b></div>
      <div className="kv"><span>할 일</span><b>{db.tasks.filter(t=>!t.done).length}건 남음</b></div>
      <div className="kv"><span>저장 위치</span><b style={{fontWeight:600,color:"var(--ink3)"}}>이 기기 (오프라인)</b></div>
    </div>
    <button className="ghostlink" onClick={()=>{ if(confirm("모든 기록을 지울까요? 되돌릴 수 없어요."))
      { save(emptyState()); notify("초기화했어요"); nav({n:"home"}); } }}>모든 기록 지우기</button>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
